<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#dce9eb" />
  <title>作品探索</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">


  <style>
    :root {
      --bg: #dce9eb;
      --surface: rgba(236,245,246,.87);
      --surface-solid: #edf5f6;
      --text: #1f2c30;
      --muted: #60747A;
      --muted-2: #7d9196;
      --line: rgba(43,76,84,.14);
      --line-strong: rgba(43,76,84,.22);
      --accent: #4f8994;
      --accent-soft: rgba(79,137,148,.12);
      --danger: #ff3b30;
      --warning: #ff9f0a;
      --success: #5d9584;
      --shadow: 0 10px 35px rgba(0,0,0,.08);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --content: 1180px;
    }

    * { box-sizing: border-box; }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 10% -10%, rgba(79,137,148,.11), transparent 28rem),
        linear-gradient(180deg, #e8f2f3 0%, var(--bg) 36%, #d6e5e8 100%);
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    button, input, textarea, select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    a {
      color: inherit;
    }

    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(220,233,235,.85);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-bottom: 1px solid var(--line);
    }

    .topbar-inner {
      width: min(var(--content), calc(100% - 32px));
      margin: 0 auto;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: grid;
      place-items: center;
      background: var(--text);
      color: white;
      font-size: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,.14);
      flex: 0 0 auto;
    }

    .brand-text {
      min-width: 0;
    }

    .brand-title {
      font-family: "Noto Serif TC", serif;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.15;
      white-space: nowrap;
    }

    .brand-kicker {
      color: var(--muted);
      font-size: 11px;
      margin-top: 2px;
      white-space: nowrap;
    }

    .admin-pill {
      display: none;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 7px 10px 7px 12px;
      background: var(--surface-solid);
      border: 1px solid var(--line);
      box-shadow: 0 3px 14px rgba(0,0,0,.04);
      color: var(--muted);
      font-size: 12px;
    }

    .admin-pill.show {
      display: inline-flex;
    }

    .admin-pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--success);
    }

    .admin-pill button {
      border: 0;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      padding: 2px 4px;
    }

    main {
      flex: 1;
      width: min(var(--content), calc(100% - 32px));
      margin: 0 auto;
      padding: 46px 0 72px;
    }

    .hero {
      padding: 20px 0 30px;
    }

    .hero-eyebrow {
      font-size: 12px;
      letter-spacing: .14em;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .hero h1 {
      margin: 0;
      font-family: "Noto Serif TC", serif;
      font-size: clamp(36px, 6vw, 68px);
      letter-spacing: -.04em;
      line-height: 1.05;
    }

    .hero p {
      margin: 14px 0 0;
      max-width: 620px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.8;
    }

    .search-panel {
      margin-top: 26px;
      padding: 14px;
      border-radius: var(--radius-xl);
      background: rgba(234,243,245,.81);
      border: 1px solid rgba(255,255,255,.58);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px) saturate(170%);
      -webkit-backdrop-filter: blur(24px) saturate(170%);
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      height: 52px;
      padding: 0 46px 0 46px;
      border: 0;
      border-radius: 18px;
      outline: none;
      background: rgba(72,101,108,.09);
      color: var(--text);
      font-size: 15px;
    }

    .search-box input:focus {
      box-shadow: inset 0 0 0 2px rgba(79,137,148,.20);
      background: rgba(72,101,108,.07);
    }

    .search-icon {
      position: absolute;
      left: 17px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted-2);
      pointer-events: none;
    }

    .search-clear {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 0;
      background: rgba(79,137,148,.28);
      color: white;
      display: none;
      place-items: center;
      cursor: pointer;
      font-size: 13px;
    }

    .search-clear.show {
      display: grid;
    }

    .filter-area {
      margin-top: 18px;
      display: grid;
      gap: 12px;
    }

    .filter-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-trigger {
      border: 1px solid var(--line);
      background: var(--surface-solid);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 13px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      transition: .18s ease;
    }

    .filter-trigger:hover,
    .filter-trigger.active {
      border-color: rgba(79,137,148,.40);
      color: var(--accent);
      background: var(--accent-soft);
    }

    .filter-trigger .count {
      margin-left: 5px;
      color: var(--accent);
    }

    .filter-drawer {
      display: none;
      padding: 14px;
      border-radius: 18px;
      background: rgba(72,101,108,.07);
    }

    .filter-drawer.show {
      display: block;
    }

    .filter-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .check-chip {
      border: 0;
      border-radius: 999px;
      padding: 8px 12px;
      background: var(--surface-solid);
      color: var(--muted);
      cursor: pointer;
      font-size: 12.5px;
      box-shadow: inset 0 0 0 1px var(--line);
    }

    .check-chip.active {
      color: white;
      background: var(--accent);
      box-shadow: none;
    }

    .escape-chip.active {
      background: var(--text);
    }

    .active-filters {
      display: none;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 2px;
    }

    .active-filters.show {
      display: flex;
    }

    .active-title {
      color: var(--muted);
      font-size: 12px;
      margin-right: 2px;
    }

    .active-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 0;
      border-radius: 999px;
      padding: 7px 10px;
      background: rgba(79,137,148,.12);
      color: var(--accent);
      cursor: pointer;
      font-size: 12px;
    }

    .clear-all {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      padding: 7px 4px;
    }

    .index-toolbar {
      margin-top: 38px;
      padding: 0 2px 12px;
      border-bottom: 1px solid var(--line-strong);
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    .index-title h2 {
      margin: 0;
      font-family: "Noto Serif TC", serif;
      font-size: 22px;
    }

    .index-title p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .primary-btn {
      border: 0;
      background: var(--accent);
      color: white;
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 700;
      font-size: 12.5px;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(79,137,148,.24);
    }

    .primary-btn:hover {
      filter: brightness(.97);
    }

    .book-list {
      display: grid;
    }
    
    #pagination {
  margin-top: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

#pagination button {
  border: 1px solid var(--line);
  background: var(--surface-solid);
  color: var(--text);
  border-radius: 999px;
  padding: 9px 13px;
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 600;
  transition: .18s ease;
}

#pagination button:hover:not(:disabled) {
  border-color: rgba(79,137,148,.40);
  color: var(--accent);
  background: var(--accent-soft);
}

#pagination button:disabled {
  opacity: .4;
  cursor: default;
}

#pagination span {
  color: var(--muted);
  font-size: 12.5px;
  font-weight: 600;
  padding: 0 4px;
}

    .book-row {
      display: grid;
      grid-template-columns: 70px minmax(0, 1fr) 140px;
      gap: 18px;
      padding: 24px 2px;
      border-bottom: 1px solid var(--line);
      cursor: pointer;
      transition: .18s ease;
    }

    .book-row:hover {
      background: rgba(247,247,249,.42);
    }

    .book-index {
      color: var(--muted-2);
      font-size: 12px;
      letter-spacing: .08em;
      padding-top: 5px;
    }

    .book-main {
      min-width: 0;
    }

    .book-title {
      margin: 0;
      font-family: "Noto Serif TC", serif;
      font-size: clamp(20px, 2.4vw, 29px);
      line-height: 1.35;
      letter-spacing: -.02em;
    }

    .book-subtitle {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .book-hook {
      margin: 13px 0 0;
      color: #3a3a3c;
      font-size: 14px;
      line-height: 1.8;
      max-width: 760px;
    }

    .book-meta {
      margin-top: 15px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 10px;
    }

    .author-link {
      border: 0;
      background: transparent;
      color: var(--accent);
      cursor: pointer;
      padding: 0;
      font-size: 12.5px;
      font-weight: 600;
    }

    .system-tag {
      border: 0;
      background: rgba(72,101,108,.08);
      color: var(--muted);
      border-radius: 999px;
      padding: 5px 8px;
      cursor: pointer;
      font-size: 11.5px;
    }

    .system-tag:hover {
      color: var(--accent);
      background: var(--accent-soft);
    }

    .book-side {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      min-width: 0;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 11.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    .status-連載中 {
      background: rgba(79,137,148,.12);
      color: var(--accent);
    }

    .status-已完結 {
      background: rgba(93,149,132,.13);
      color: #527d72;
    }

    .status-停更中 {
      background: rgba(255,159,10,.13);
      color: #b26a00;
    }

    .row-arrow {
      color: var(--muted-2);
      font-size: 22px;
      line-height: 1;
    }

    .empty-state {
      padding: 72px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state strong {
      display: block;
      color: var(--text);
      font-family: "Noto Serif TC", serif;
      font-size: 20px;
      margin-bottom: 8px;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 26px 0 calc(30px + env(safe-area-inset-bottom));
      color: var(--muted);
      font-size: 12px;
    }

    .footer-inner {
      width: min(var(--content), calc(100% - 32px));
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .footer-manage {
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 6px;
      font-size: 12px;
    }

    .footer-manage:hover {
      color: var(--accent);
    }

    .footer-signature {
      width: min(var(--content), calc(100% - 32px));
      margin: 22px auto 0;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      text-align: center;
      color: var(--muted-2);
      font-family: "Noto Serif TC", serif;
      font-size: 12px;
      letter-spacing: .08em;
    }

    .footer-signature .en {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Noto Sans TC", sans-serif;
      letter-spacing: .06em;
    }

    /* Drawer / Sheet */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      background: rgba(0,0,0,.24);
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      z-index: 80;
      top: 0;
      right: 0;
      width: min(560px, 92vw);
      height: 100dvh;
      transform: translateX(102%);
      transition: transform .28s cubic-bezier(.22,.8,.24,1);
      background: rgba(234,243,245,.97);
      backdrop-filter: blur(30px) saturate(180%);
      -webkit-backdrop-filter: blur(30px) saturate(180%);
      box-shadow: -18px 0 50px rgba(0,0,0,.13);
      display: flex;
      flex-direction: column;
    }

    .drawer.show {
      transform: translateX(0);
    }

    .drawer-grabber {
      display: none;
    }

    .drawer-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(234,243,245,.91);
      backdrop-filter: blur(20px);
    }

    .drawer-header-title {
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 50%;
      background: rgba(72,101,108,.10);
      color: var(--text);
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .drawer-body {
      padding: 24px 24px 42px;
      overflow: auto;
    }

    .detail-title {
      margin: 0;
      font-family: "Noto Serif TC", serif;
      font-size: clamp(28px, 5vw, 40px);
      line-height: 1.22;
      letter-spacing: -.03em;
    }

    .detail-subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
    }

    .detail-hook {
      margin: 18px 0 0;
      font-size: 16px;
      line-height: 1.85;
      color: #2c2c2e;
      font-weight: 500;
    }

    .detail-section {
      margin-top: 26px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
    }

    .detail-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      margin-bottom: 10px;
    }

    .detail-copy {
      margin: 0;
      color: #3a3a3c;
      font-size: 14px;
      line-height: 1.95;
      white-space: pre-wrap;
    }

    .detail-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
    }

    .detail-line:last-child {
      border-bottom: 0;
    }

    .detail-key {
      color: var(--muted);
      flex: 0 0 auto;
    }

    .detail-value {
      text-align: right;
      min-width: 0;
    }

    .detail-tag-wrap,
    .custom-tag-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .detail-tag {
      border: 0;
      border-radius: 999px;
      padding: 7px 10px;
      background: rgba(79,143,132,.11);
      color: var(--accent);
      cursor: pointer;
      font-size: 12px;
    }

    .custom-tag {
      border-radius: 999px;
      padding: 7px 10px;
      background: rgba(72,101,108,.08);
      color: var(--muted);
      font-size: 12px;
    }

    .link-list {
      display: grid;
      gap: 9px;
    }

    .work-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-decoration: none;
      border-radius: 14px;
      padding: 13px 14px;
      background: var(--surface-solid);
      border: 1px solid var(--line);
      color: var(--text);
      font-size: 13px;
    }

    .work-link:hover {
      border-color: rgba(79,137,148,.30);
    }

    .share-actions,
    .admin-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .action-btn {
      flex: 1 1 160px;
      border: 0;
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12.5px;
      background: rgba(72,101,108,.09);
      color: var(--text);
    }

    .action-btn.accent {
      background: var(--accent);
      color: white;
    }

    .action-btn.danger {
      background: rgba(255,59,48,.10);
      color: var(--danger);
    }

    /* Modal */
    .modal-wrap {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(0,0,0,.28);
      backdrop-filter: blur(8px);
    }

    .modal-wrap.show {
      display: flex;
    }

    .modal-card {
      width: min(680px, 100%);
      max-height: min(92dvh, 900px);
      overflow: auto;
      background: rgba(255,255,255,.98);
      border-radius: 26px;
      box-shadow: 0 24px 80px rgba(0,0,0,.18);
      border: 1px solid rgba(255,255,255,.82);
    }

    .modal-card.small {
      width: min(430px, 100%);
    }

    .modal-head {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 20px 14px;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--line);
    }

    .modal-head h3 {
      margin: 0;
      font-family: "Noto Serif TC", serif;
      font-size: 20px;
    }

    .modal-body {
      padding: 20px;
    }

    .form-section {
      padding: 18px 0;
      border-bottom: 1px solid var(--line);
    }

    .form-section:first-child {
      padding-top: 0;
    }

    .form-section:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .form-section-title {
      margin: 0 0 13px;
      font-size: 12px;
      color: var(--muted);
      font-weight: 700;
      letter-spacing: .05em;
    }

    .form-grid {
      display: grid;
      gap: 12px;
    }

    .form-grid.two {
      grid-template-columns: 1fr 1fr;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11.5px;
      font-weight: 700;
    }

    .field input,
    .field textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 13px;
      padding: 11px 12px;
      outline: none;
      background: rgba(72,101,108,.06);
      color: var(--text);
      font-size: 13px;
    }

    .field textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.7;
    }

    .field input:focus,
    .field textarea:focus {
      border-color: rgba(79,137,148,.42);
      box-shadow: 0 0 0 3px rgba(79,137,148,.11);
    }

    .counter {
      margin-top: 5px;
      text-align: right;
      font-size: 10.5px;
      color: var(--muted);
    }

    @media (max-width: 760px) {

<script>
/* =========================================================
   Supabase 後端版
========================================================= */

const CREATION_TYPES = ["原創", "同人", "改編"];

const SERIES = [
  { id: "romance", label: "戀愛系列", options: ["戀愛系列", "戀愛", "耽美", "言情", "百合"] },

  { id: "era", label: "時代背景", options: ["時代背景", "古風", "現代", "未來", "末日"] },

  { id: "fantasy", label: "奇幻系列", options: ["奇幻系列", "東方奇幻", "西方奇幻", "現代奇幻"] },

  { id: "xuanhuan", label: "玄幻系列", options: ["玄幻系列", "東方玄幻", "現代玄幻", "架空玄幻"] },

  { id: "wuxia", label: "武俠仙俠系列", options: ["武俠仙俠系列", "武俠", "仙俠"] },

  { id: "mystery", label: "推理系列", options: ["推理系列", "一般推理", "特殊設定推理"] },

{ 
  id: "crime", label: "犯罪系列", options: ["犯罪系列", "犯罪", "犯罪心理"] 
},

  { id: "investigation", label: "刑偵系列", options: ["刑偵系列", "刑偵", "調查辦案"] },

  { id: "suspense", label: "懸疑系列", options: ["懸疑系列", "懸疑", "驚悚"] },

  { id: "supernatural", label: "靈異系列", options: ["靈異系列", "靈異", "恐怖"] },

  { id: "transmigration", label: "穿越系列", options: ["穿越系列", "穿越", "重生", "穿書"] },

  { id: "scifi", label: "科幻系列", options: ["科幻系列", "一般科幻", "未來科技", "星際宇宙"] },

  { id: "history", label: "歷史系列", options: ["歷史系列", "真實歷史", "架空歷史"] },

  { id: "game", label: "遊戲系列", options: ["遊戲系列", "遊戲", "電競", "網遊"] },

  { id: "military", label: "戰爭軍事系列", options: ["戰爭軍事系列", "戰爭軍事", "陸軍", "海軍", "空軍", "海軍陸戰隊"] },

  { id: "worldview", label: "世界觀設定", options: ["世界觀設定", "ABO", "哨兵嚮導"] }
];

const ESCAPE_TAG = "我也不知道怎麼分類";
const STATUS_OPTIONS = ["連載中", "已完結", "停更中"];
const MAX_HOOK = 30;
const MAX_SUBTITLE = 16;
const MAX_CUSTOM_TAG = 16;

/* =========================================================
   Supabase
========================================================= */

const SUPABASE_URL =
  "https://bkjqaetxwvcdciieevvs.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_dAHoIimWgbGAF2wtIVSZfg_V8rzc200";

const ADMIN_UID =
  "372c6a7f-4e6b-49fa-8228-183b46cbdede";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

let currentSession = null;
let loadingWorks = true;

const SAMPLE_WORKS = [];

let works = [];
let searchText = "";
let selectedCreationTypes = new Set();
let selectedCategories = new Set();
let selectedAuthor = "";
let escapeFilter = false;
let openSeriesId = "";
let activeDetailId = null;
let isAdmin = false;
/* -------------------- 分頁一次12本 -------------------- */
const PAGE_SIZE = 12;
let currentPage = 1;
let formState = null;

/* -------------------- 工具 -------------------- */

function cryptoRandomId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "w-" + Date.now() + "-" + Math.random().toString(36).slice(2, 9);
}

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttr(value) {
  return escapeHTML(value).replace(/`/g, "&#096;");
}

function normalizeWork(raw) {
  return {
    id: raw.id || cryptoRandomId(),
    author: String(raw.author || "").trim(),
    title: String(raw.title || "").trim(),
    subtitle: [...String(raw.subtitle || "").trim()].slice(0, MAX_SUBTITLE).join(""),
    hook: String(raw.hook || "").slice(0, MAX_HOOK),
    copy: String(raw.copy || ""),
    status: STATUS_OPTIONS.includes(raw.status) ? raw.status : "連載中",
    lastPublishedAt: raw.status === "停更中" ? String(raw.lastPublishedAt || "") : "",
    creationTypes: Array.isArray(raw.creationTypes)
      ? raw.creationTypes.filter(x => CREATION_TYPES.includes(x))
      : [],
    categories: Array.isArray(raw.categories)
      ? raw.categories.filter(isValidCategory)
      : [],
    escape: Boolean(raw.escape),
    customTags: Array.isArray(raw.customTags)
      ? raw.customTags
          .map(x => String(x).trim().slice(0, MAX_CUSTOM_TAG))
          .filter(Boolean)
      : [],
    links: Array.isArray(raw.links)
      ? raw.links
          .map(link => ({
            label: String(link?.label || "").trim(),
            url: String(link?.url || "").trim()
          }))
          .filter(link => link.label || link.url)
      : [],
    createdAt: raw.createdAt || new Date().toISOString()
  };
}

function isValidCategory(value) {
  return SERIES.some(group => group.options.includes(value));
}

function rowToWork(row) {
  return normalizeWork({
    id: row.id,
    author: row.author,
    title: row.title,
    subtitle: row.subtitle,
    hook: row.hook,
    copy: row.copy,
    status: row.status,
    lastPublishedAt: row.last_published_at,
    creationTypes: row.creation_types,
    categories: row.categories,
    escape: row.escape,
    customTags: row.custom_tags,
    links: row.links,
    createdAt: row.created_at
  });
}

function workToRow(work) {
  return {
    author: work.author || "",
    title: work.title || "",
    subtitle: work.subtitle || "",
    hook: work.hook || "",
    copy: work.copy || "",
    status: work.status || "連載中",
    last_published_at:
      work.status === "停更中" && work.lastPublishedAt
        ? work.lastPublishedAt
        : null,
    creation_types: Array.isArray(work.creationTypes)
      ? work.creationTypes
      : [],
    categories: Array.isArray(work.categories)
      ? work.categories
      : [],
    escape: Boolean(work.escape),
    custom_tags: Array.isArray(work.customTags)
      ? work.customTags
      : [],
    links: Array.isArray(work.links)
      ? work.links
      : []
  };
}

async function loadWorks() {
  loadingWorks = true;
  renderBookList();

  try {
    const { data, error } =
      await supabaseClient
        .from("works")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) throw error;

    works = (data || []).map(rowToWork);
  } catch (error) {
    console.error("讀取作品失敗", error);
    works = [];
    showToast("作品資料讀取失敗");
  } finally {
    loadingWorks = false;
    renderAll();

    const workIdFromUrl =
      new URL(location.href).searchParams.get("work");

    if (workIdFromUrl && findWork(workIdFromUrl)) {
      setTimeout(() => openDetail(workIdFromUrl, false), 60);
    }
  }
}

async function insertWork(work) {
  const { data, error } =
    await supabaseClient
      .from("works")
      .insert(workToRow(work))
      .select("*")
      .single();

  if (error) throw error;
  return rowToWork(data);
}

async function updateWorkInDatabase(work) {
  const { data, error } =
    await supabaseClient
      .from("works")
      .update(workToRow(work))
      .eq("id", work.id)
      .select("*")
      .single();

  if (error) throw error;
  return rowToWork(data);
}

async function deleteWorkFromDatabase(id) {
  const { error } =
    await supabaseClient
      .from("works")
      .delete()
      .eq("id", id);

  if (error) throw error;
}

function findWork(id) {
  return works.find(work => String(work.id) === String(id)) || null;
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove("show"), 2100);
}

function getAllSystemTags(work) {
  return [...(work.creationTypes || []), ...(work.categories || [])];
}

function filterWorks() {
  const q = searchText.trim().toLocaleLowerCase("zh-Hant");

  return works.filter(work => {
    const searchBlob = [
      work.title,
      work.subtitle,
      work.author,
      work.hook,
      work.copy
    ].join(" ").toLocaleLowerCase("zh-Hant");

    const searchOk = !q || searchBlob.includes(q);
    const authorOk = !selectedAuthor || work.author === selectedAuthor;

    /* 創作類型 / 系統分類採 AND：選越多，結果越精準 */
    const creationOk =
      selectedCreationTypes.size === 0 ||
      [...selectedCreationTypes].every(tag => work.creationTypes.includes(tag));

    const categoriesOk =
      selectedCategories.size === 0 ||
      [...selectedCategories].every(tag => work.categories.includes(tag));

    const escapeOk = !escapeFilter || work.escape;

    return searchOk && authorOk && creationOk && categoriesOk && escapeOk;
  });
}

function goHome() {
  closeDetail(false);

  searchText = "";
  selectedCreationTypes.clear();
  selectedCategories.clear();
  selectedAuthor = "";
  escapeFilter = false;
  openSeriesId = "";
  currentPage = 1;

  const searchInput = document.getElementById("searchInput");
  if (searchInput) searchInput.value = "";
  const searchClear = document.getElementById("searchClear");
  if (searchClear) searchClear.classList.remove("show");

  const url = new URL(location.href);
  url.searchParams.delete("work");
  history.replaceState(null, "", url);

  renderAll();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* -------------------- 篩選 UI -------------------- */

function renderFilters() {
  const creationContainer = document.getElementById("creationTypeOptions");
  creationContainer.innerHTML = [
    ...CREATION_TYPES.map(type => `
      <button
        type="button"
        class="check-chip ${selectedCreationTypes.has(type) ? "active" : ""}"
        onclick="toggleCreationType('${escapeAttr(type)}')"
      >${escapeHTML(type)}</button>
    `),
    `
      <button
        type="button"
        class="check-chip escape-chip ${escapeFilter ? "active" : ""}"
        onclick="toggleEscapeFilter()"
      >${ESCAPE_TAG}</button>
    `
  ].join("");

  const triggerContainer = document.getElementById("seriesTriggers");
  triggerContainer.innerHTML = SERIES.map(group => {
    const count = group.options.filter(option => selectedCategories.has(option)).length;
    return `
      <button
        type="button"
        class="filter-trigger ${openSeriesId === group.id || count ? "active" : ""}"
        onclick="toggleSeries('${group.id}')"
      >
        ${escapeHTML(group.label)}
        ${count ? `<span class="count">${count}</span>` : ""}
      </button>
    `;
  }).join("");

  const drawers = document.getElementById("seriesDrawers");
  drawers.innerHTML = SERIES.map(group => `
    <div class="filter-drawer ${openSeriesId === group.id ? "show" : ""}">
      <div class="filter-options">
        ${group.options.map(option => `
          <button
            type="button"
            class="check-chip ${selectedCategories.has(option) ? "active" : ""}"
            onclick="toggleCategory('${escapeAttr(option)}')"
          >${escapeHTML(option)}</button>
        `).join("")}
      </div>
    </div>
  `).join("");

  renderActiveFilters();
}

function renderActiveFilters() {
  const box = document.getElementById("activeFilters");
  const chips = [];

  if (selectedAuthor) {
    chips.push(`
      <button class="active-chip" type="button" onclick="clearAuthorFilter()">
        作者：${escapeHTML(selectedAuthor)} ×
      </button>
    `);
  }

  selectedCreationTypes.forEach(tag => {
    chips.push(`
      <button class="active-chip" type="button" onclick="toggleCreationType('${escapeAttr(tag)}')">
        ${escapeHTML(tag)} ×
      </button>
    `);
  });

  selectedCategories.forEach(tag => {
    chips.push(`
      <button class="active-chip" type="button" onclick="toggleCategory('${escapeAttr(tag)}')">
        ${escapeHTML(tag)} ×
      </button>
    `);
  });

  if (escapeFilter) {
    chips.push(`
      <button class="active-chip" type="button" onclick="toggleEscapeFilter()">
        ${ESCAPE_TAG} ×
      </button>
    `);
  }

  const has = chips.length > 0;
  box.classList.toggle("show", has);
  box.innerHTML = has
    ? `<span class="active-title">目前條件</span>${chips.join("")}<button class="clear-all" type="button" onclick="clearAllFilters()">清除全部</button>`
    : "";
}

function toggleSeries(id) {
  openSeriesId = openSeriesId === id ? "" : id;
  renderFilters();
}

function toggleCreationType(type) {
  selectedCreationTypes.has(type)
    ? selectedCreationTypes.delete(type)
    : selectedCreationTypes.add(type);
    currentPage = 1;
  renderAll();
}

function toggleCategory(category) {
  selectedCategories.has(category)
    ? selectedCategories.delete(category)
    : selectedCategories.add(category);
    currentPage = 1;
  renderAll();
}

function toggleEscapeFilter() {
  escapeFilter = !escapeFilter;
  currentPage = 1;
  renderAll();
}

function setAuthorFilter(author) {
  selectedAuthor = author;
  currentPage = 1;
  closeDetail();
  renderAll();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function clearAuthorFilter() {
  selectedAuthor = "";
  currentPage = 1;
  renderAll();
}

function clearAllFilters() {
  selectedCreationTypes.clear();
  selectedCategories.clear();
  selectedAuthor = "";
  escapeFilter = false;
  searchText = "";

  document.getElementById("searchInput").value = "";
  document.getElementById("searchClear").classList.remove("show");

      <div class="empty-state">

      </div>
    `;

  }

  const filtered = filterWorks();
  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));

if (currentPage > totalPages) currentPage = totalPages;

const startIndex = (currentPage - 1) * PAGE_SIZE;
const pagedWorks = filtered.slice(startIndex, startIndex + PAGE_SIZE);
renderPagination(totalPages);
  document.getElementById("resultCount").textContent =
    `${filtered.length} 部作品${works.length !== filtered.length ? `／共 ${works.length} 部` : ""}`;

      <article class="book-row" onclick="openDetail('${work.id}')">

        <div class="book-main">
          <h3 class="book-title">${escapeHTML(work.title)}</h3>
          ${work.subtitle ? `<div class="book-subtitle">${escapeHTML(work.subtitle)}</div>` : ""}

          <div class="book-meta">
            <button

              type="button"
              onclick="event.stopPropagation(); setAuthorFilter('${escapeAttr(work.author)}')"

              <button
                class="system-tag"

function renderPagination(totalPages) {
  const box = document.getElementById("pagination");

  if (totalPages <= 1) {
    box.innerHTML = "";
    return;
  }

  box.innerHTML = `
<button type="button" onclick="changePage(-1)" ${currentPage === 1 ? "disabled" : ""}>上一頁</button>
  <span>${currentPage} / ${totalPages}</span>
<button type="button" onclick="changePage(1)" ${currentPage === totalPages ? "disabled" : ""}>下一頁</button>
`;
}

function changePage(direction) {
  const nextPage = currentPage + direction;
  const totalPages = Math.max(1, Math.ceil(filterWorks().length / PAGE_SIZE));

  if (nextPage < 1 || nextPage > totalPages) return;

  currentPage = nextPage;
  renderAll();

  document.querySelector(".index-toolbar")?.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function applySystemTag(tag) {
  if (CREATION_TYPES.includes(tag)) {
    selectedCreationTypes.add(tag);
  } else if (isValidCategory(tag)) {
    selectedCategories.add(tag);
  }

  currentPage = 1;

  closeDetail();
  renderAll();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function formatDate(value) {
  if (!value) return "";
  const d = new Date(value + "T00:00:00");
  if (Number.isNaN(d.getTime())) return value;
  return new Intl.DateTimeFormat("zh-Hant", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(d);
}

function safeUrl(url) {
  const value = String(url || "").trim();
  if (/^https?:\/\//i.test(value)) return value;
  return "#";
}

/* -------------------- 分享 -------------------- */

function getWorkShareUrl(work) {
  const url = new URL(location.href);
  url.search = "";
  url.hash = "";
  url.searchParams.set("work", work.id);
  return url.toString();
}

async function copyShareUrl(shareUrl) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(shareUrl);
      showToast("作品連結已複製");
      return true;
    }
  } catch (error) {
    console.warn("Clipboard API 無法使用", error);
  }

  try {
    const input = document.createElement("textarea");
    input.value = shareUrl;
    input.setAttribute("readonly", "");
    input.style.position = "fixed";
    input.style.opacity = "0";
    document.body.appendChild(input);
    input.select();
    input.setSelectionRange(0, input.value.length);
    const copied = document.execCommand("copy");
    input.remove();

    if (copied) {
      showToast("作品連結已複製");
      return true;
    }
  } catch (error) {
    console.warn("備用複製方式無法使用", error);
  }

  window.prompt("複製作品連結", shareUrl);
  return false;
}

async function shareWork(id) {
  const work = findWork(id);
  if (!work) return;

  const shareUrl = getWorkShareUrl(work);
  const shareData = {
    title: work.title,
    text: [work.title, work.subtitle, work.hook].filter(Boolean).join("\n"),
    url: shareUrl
  };

  if (typeof navigator.share === "function") {
    try {
      if (!navigator.canShare || navigator.canShare(shareData)) {
        await navigator.share(shareData);
        return;
      }
    } catch (error) {
      if (error?.name === "AbortError") return;
      console.warn("系統分享失敗，改用複製連結", error);
    }
  }

  await copyShareUrl(shareUrl);
}

async function downloadShareCard(id) {
  const work = findWork(id);
  if (!work) return;

  const width = 820;
  const height = 450;
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");

  /* 背景 */
  ctx.fillStyle = "#D9E8EB";
  ctx.fillRect(0, 0, width, height);

  /* 主卡：偏實體書籤比例 */
  roundedRect(ctx, 24, 24, width - 48, height - 48, 28);
  ctx.fillStyle = "#EDF5F6";
  ctx.fill();

  const left = 58;
  const contentW = width - 116;
  let y = 88;

  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";

  /* 書名 */
  ctx.fillStyle = "#1F2C30";
  ctx.font = '700 40px "Noto Serif TC", serif';
  y = drawWrappedText(ctx, work.title, left, y, contentW, 58, 1);

  /* 副標 */
  if (work.subtitle) {
    ctx.fillStyle = "#60747A";
    ctx.font = '500 21px "Noto Sans TC", sans-serif';
    y += 34;
    y = drawWrappedText(
      ctx,
      [...work.subtitle].slice(0, MAX_SUBTITLE).join(""),
      left,
      y,
      contentW,
      36,
      1
    );
  }

  /* 作者 */
  y += 46;
  ctx.fillStyle = "#7D9196";
  ctx.font = '600 17px "Noto Sans TC", sans-serif';
  ctx.fillText("作者", left, y);

  ctx.fillStyle = "#1F2C30";
  ctx.font = '700 20px "Noto Sans TC", sans-serif';
  ctx.fillText(work.author || "未署名", left + 62, y);

  /* 分類 */
  const tags = getAllSystemTags(work).slice(0, 6);
  y += 48;
  ctx.fillStyle = "#60747A";
  ctx.font = '500 17px "Noto Sans TC", sans-serif';
  y = drawWrappedText(
    ctx,
    tags.join("  ·  "),
    left,
    y,
    contentW,
    30,
    1
  );

  /* 作品網址：最多顯示 3 個平台 */
  const shareLinks = work.links
    .filter(link => /^https?:\/\//i.test(link.url || ""))
    .slice(0, 3);

  y += 38;

  ctx.fillStyle = "#7D9196";
  ctx.font = '600 15px "Noto Sans TC", sans-serif';
  ctx.fillText("作品網址", left, y);

  if (shareLinks.length) {
    shareLinks.forEach((link, index) => {
      const linkY = y + index * 24;

      /* 平台名稱 */
      ctx.fillStyle = "#1F2C30";
      ctx.font = '600 14px "Noto Sans TC", sans-serif';

      const platformName = link.label || "作品連結";
      ctx.fillText(platformName, left + 82, linkY);

      /* 網址 */
      const platformWidth = ctx.measureText(platformName).width;

      ctx.fillStyle = "#60747A";
      ctx.font = '500 13px "Noto Sans TC", sans-serif';

      const urlX = left + 82 + platformWidth + 12;
      const maxUrlWidth = contentW - (urlX - left);

      let displayUrl = link.url;

      while (
        ctx.measureText(displayUrl).width > maxUrlWidth &&
        displayUrl.length > 4
      ) {
        displayUrl = displayUrl.slice(0, -1);
      }

      if (displayUrl !== link.url) {
        displayUrl = displayUrl.slice(0, -1) + "…";
      }

      ctx.fillText(displayUrl, urlX, linkY);
    });
  } else {
    ctx.fillStyle = "#60747A";
    ctx.font = '500 14px "Noto Sans TC", sans-serif';
    ctx.fillText("未提供作品網址", left + 82, y);
  }

  /* 底部品牌 */
  ctx.strokeStyle = "rgba(43,76,84,.14)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(58, 350);
  ctx.lineTo(width - 58, 350);
  ctx.stroke();

  ctx.fillStyle = "#7D9196";
  ctx.font = '600 17px "Noto Serif TC", serif';
  ctx.fillText("慢 慢", 58, 398);

  const logoWidth = ctx.measureText("慢 慢").width;
  ctx.font = '500 16px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif';
  ctx.fillText(" | stillness by slowly", 58 + logoWidth + 5, 398);

  ctx.textAlign = "right";
  ctx.fillStyle = "#7D9196";
  ctx.font = '500 14px "Noto Sans TC", sans-serif';
  ctx.fillText("作品探索", width - 58, 398);
  ctx.textAlign = "left";

  /* 產生 PNG */
  const blob = await new Promise(resolve =>
    canvas.toBlob(resolve, "image/png")
  );

  if (!blob) {
    showToast("書卡產生失敗");
    return;
  }

  const previewUrl = URL.createObjectURL(blob);

  const safeName = (work.title || "作品")
    .replace(/[\\/:*?"<>|]/g, "_")
    .trim();

  /* 暫存圖片，等使用者確認後才下載 */
  window.shareCardPreview = {
    blob,
    url: previewUrl,
    filename: `${safeName}_分享書卡.png`
  };

  /* 開啟預覽 */
  openModal(`
    <div class="modal-head">
      <h3>分享書卡預覽</h3>
      <button
        class="icon-btn"
        type="button"
        onclick="closeShareCardPreview()"
      >×</button>
    </div>

    <div class="modal-body">
      <img
        src="${previewUrl}"
        alt="${escapeAttr(work.title)} 分享書卡"
        style="
          display:block;
          width:100%;
          height:auto;
          border-radius:16px;
        "
      >
    </div>

    <div class="form-footer">
      <button
        class="ghost-btn"
        type="button"
        onclick="closeShareCardPreview()"
      >取消</button>

      <button
        class="save-btn"
        type="button"
        onclick="confirmShareCardDownload()"
      >下載 PNG</button>
    </div>
  `);
}

function confirmShareCardDownload() {
  const data = window.shareCardPreview;
  if (!data) return;

  const a = document.createElement("a");
  a.href = data.url;
  a.download = data.filename;
  document.body.appendChild(a);
  a.click();
  a.remove();

  closeShareCardPreview();
}

function closeShareCardPreview() {
  const data = window.shareCardPreview;

  if (data?.url) {
    URL.revokeObjectURL(data.url);
  }

  window.shareCardPreview = null;
  closeModal();
}

function roundedRect(ctx, x, y, w, h, r) {
  const radius = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + w, y, x + w, y + h, radius);
  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);
  ctx.arcTo(x, y, x + w, y, radius);
  ctx.closePath();
}

function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines = Infinity) {
  const chars = [...String(text || "")];
  let line = "";
  let lines = [];

  for (const ch of chars) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = ch;
      if (lines.length >= maxLines) break;
    } else {
      line = test;
    }
  }

  if (line && lines.length < maxLines) lines.push(line);

  if (lines.length === maxLines && chars.join("") !== lines.join("")) {
    let last = lines[lines.length - 1];
    while (ctx.measureText(last + "…").width > maxWidth && last.length) {
      last = last.slice(0, -1);
    }
    lines[lines.length - 1] = last + "…";
  }

  lines.forEach((lineText, index) => {
    ctx.fillText(lineText, x, y + index * lineHeight);
  });

  return y + Math.max(0, lines.length - 1) * lineHeight;
}

function sanitizeFilename(name) {
  return String(name).replace(/[\\/:*?"<>|]/g, "_").trim() || "作品";
}

async function confirmPasswordReset() {
  const password =
    document.getElementById("resetPassword")?.value || "";

  const confirmPassword =
    document.getElementById("resetPasswordConfirm")?.value || "";

  const errorBox =
    document.getElementById("resetPasswordError");

  const btn =
    document.getElementById("resetPasswordBtn");

  if (!password || !confirmPassword) {
    if (errorBox) {
      errorBox.textContent = "請輸入新密碼。";
    }
    return;
  }

  if (password !== confirmPassword) {
    if (errorBox) {
      errorBox.textContent = "兩次輸入的密碼不一致。";
    }
    return;
  }

  if (password.length < 8) {
    if (errorBox) {
      errorBox.textContent = "密碼至少需要 8 個字元。";
    }
    return;
  }

  if (errorBox) errorBox.textContent = "";

  if (btn) {
    btn.disabled = true;
    btn.textContent = "修改中…";
  }

  try {
    const { error } =
      await supabaseClient.auth.updateUser({
        password
      });

    if (error) throw error;

    closeModal();

    showToast("密碼已更新");

    /* 改完直接登出，讓新密碼重新登入一次 */
    await supabaseClient.auth.signOut();

    currentSession = null;
    isAdmin = false;

    renderAdminState();
    renderBookList();

  } catch (error) {
    console.error("修改密碼失敗", error);

    if (errorBox) {
      errorBox.textContent =
        "修改密碼失敗，請重新寄送密碼重設信後再試一次。";
    }

    if (btn) {
      btn.disabled = false;
      btn.textContent = "修改密碼";
    }
  }
}

function openLogin() {
  if (isAdmin) {
    showToast("目前已在管理模式");
    return;
  }

  openModal(`
    <div class="modal-head">
      <h3>管理者登入</h3>
      <button class="icon-btn" type="button" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <div class="field">
          <label>Email</label>
          <input id="loginEmail" type="email" autocomplete="username" placeholder="管理用 Email">
        </div>
        <div class="field">
          <label>密碼</label>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="管理用密碼">
        </div>
      </div>

      <div class="login-note">
        此區域只有管理者可以登入。登入權限由 Supabase Auth 與資料庫 RLS 控制。
      </div>

      <div id="loginError" class="error-text"></div>

      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;">
        <button class="ghost-btn" type="button" onclick="closeModal()">取消</button>
        <button class="save-btn" type="button" onclick="loginAdmin()">登入</button>
      </div>
    </div>
  `, true);

  setTimeout(() => document.getElementById("loginEmail")?.focus(), 50);
}

async function loginAdmin() {
  const email = document.getElementById("loginEmail")?.value.trim() || "";
  const password = document.getElementById("loginPassword")?.value || "";
  const errorBox = document.getElementById("loginError");

  if (!email || !password) {
    if (errorBox) errorBox.textContent = "請輸入 Email 與密碼。";
    return;
  }

  if (errorBox) errorBox.textContent = "";

  try {
    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) throw error;

    if (!data.user || data.user.id !== ADMIN_UID) {
      await supabaseClient.auth.signOut();
      currentSession = null;
      isAdmin = false;
      if (errorBox) errorBox.textContent = "此帳號沒有管理權限。";
      return;
    }

    currentSession = data.session;
    isAdmin = true;

    closeModal();
    renderAdminState();
    renderBookList();
    if (activeDetailId) openDetail(activeDetailId, false);
    showToast("已進入管理模式");
  } catch (error) {
    console.error("登入失敗", error);
    if (errorBox) {
      errorBox.textContent = "登入失敗，請確認 Email 或密碼是否正確。";
    }
  }
}

async function logoutAdmin() {
  try {
    await supabaseClient.auth.signOut();
  } catch (error) {
    console.error("登出失敗", error);
  }

  currentSession = null;
  isAdmin = false;
  closeDetail();
  renderAdminState();
  renderBookList();
  showToast("已登出");
}

function renderAdminState() {
  document.getElementById("adminPill").classList.toggle("show", isAdmin);
  document.getElementById("addWorkBtn").style.display = isAdmin ? "inline-flex" : "none";
  document.getElementById("manageBtn").textContent = isAdmin ? "管理中" : "管理";
}

/* -------------------- 新增 / 編輯作品 -------------------- */

function createEmptyFormState() {
  return {
    id: "",
    author: "",
    title: "",
    subtitle: "",
    hook: "",
    copy: "",
    status: "連載中",
    lastPublishedAt: "",
    creationTypes: [],
    categories: [],
    escape: false,
    customTags: [],
    links: [{ label: "", url: "" }],
    createdAt: new Date().toISOString()
  };
}

function openWorkForm(id = "") {
  if (!isAdmin) {
    openLogin();
    return;
  }

  closeDetail();

  if (id) {
    const work = findWork(id);
    if (!work) return;
    formState = JSON.parse(JSON.stringify(work));
    if (!formState.links.length) formState.links = [{ label: "", url: "" }];
  } else {
    formState = createEmptyFormState();
  }

  renderWorkForm();
}

function renderWorkForm() {
  const editing = Boolean(formState.id);

  openModal(`
    <div class="modal-head">
      <h3>${editing ? "編輯作品" : "新增作品"}</h3>
      <button class="icon-btn" type="button" onclick="closeModal()">×</button>
    </div>

    <div class="modal-body">
      <section class="form-section">
        <div class="form-section-title">基本資料</div>
        <div class="form-grid">
          <div class="form-grid two">
            <div class="field">
              <label>作者 *</label>
              <input id="formAuthor" value="${escapeAttr(formState.author)}" placeholder="作者名稱">
            </div>
            <div class="field">
              <label>書名 *</label>
              <input id="formTitle" value="${escapeAttr(formState.title)}" placeholder="作品名稱">
            </div>
          </div>

          <div class="field">
            <label>副標題（選填，最多 ${MAX_SUBTITLE} 字）</label>
            <input
              id="formSubtitle"
              maxlength="${MAX_SUBTITLE}"
              value="${escapeAttr(formState.subtitle)}"
              placeholder="最多 ${MAX_SUBTITLE} 字"
              oninput="updateSubtitleCounter()"
            >
            <div id="subtitleCounter" class="counter">${[...formState.subtitle].length} / ${MAX_SUBTITLE}</div>
          </div>
        </div>
      </section>

      <section class="form-section">
        <div class="form-section-title">作品介紹</div>
        <div class="form-grid">
          <div class="field">
            <label>一句話故事簡介 *（最多 ${MAX_HOOK} 字）</label>
            <input
              id="formHook"
              maxlength="${MAX_HOOK}"
              value="${escapeAttr(formState.hook)}"
              placeholder="讓讀者在一眼內知道這本在講什麼"
              oninput="updateHookCounter()"
            >
            <div id="hookCounter" class="counter">${[...formState.hook].length} / ${MAX_HOOK}</div>
          </div>

          <div class="field">
            <label>文案（選填）</label>
            <textarea id="formCopy" placeholder="完整作品文案">${escapeHTML(formState.copy)}</textarea>
          </div>
        </div>
      </section>

      <section class="form-section">
        <div class="form-section-title">作品狀態</div>
        <div id="statusSegments" class="segmented">
          ${STATUS_OPTIONS.map(status => `
            <button
              class="segment ${formState.status === status ? "active" : ""}"
              type="button"
              onclick="setFormStatus('${status}')"
            >${status}</button>
          `).join("")}
        </div>

        <div id="lastPublishedField" class="field" style="margin-top:12px;${formState.status === "停更中" ? "" : "display:none;"}">
          <label>最後發布日期（選填）</label>
          <input id="formLastPublishedAt" type="date" value="${escapeAttr(formState.lastPublishedAt)}">
        </div>
      </section>

      <section class="form-section">
        <div class="form-section-title">創作類型（可複選）</div>
        <div class="segmented">
          ${CREATION_TYPES.map(type => `
            <button
              class="segment ${formState.creationTypes.includes(type) ? "active" : ""}"
              type="button"
              onclick="toggleFormCreationType('${type}')"
            >${type}</button>
          `).join("")}
        </div>
      </section>

      <section class="form-section">
        <div class="form-section-title">作品分類（可跨系列複選）</div>
        <div class="series-editor">
          ${SERIES.map(group => `
            <div class="series-block">
              <button
                type="button"
                class="series-toggle"
                onclick="toggleFormSeries('${group.id}')"
              >
                <span>${group.label}</span>
                <span>
                  ${group.options.filter(option => formState.categories.includes(option)).length
                    ? `${group.options.filter(option => formState.categories.includes(option)).length}`
                    : "＋"}
                </span>
              </button>
              <div id="formSeries-${group.id}" class="series-children">
                ${group.options.map(option => `
                  <button
                    type="button"
                    class="check-chip ${formState.categories.includes(option) ? "active" : ""}"
                    onclick="toggleFormCategory('${option}')"
                  >${option}</button>
                `).join("")}
              </div>
            </div>
          `).join("")}
        </div>

        <div style="margin-top:10px;">
          <button
            type="button"
            class="check-chip escape-chip ${formState.escape ? "active" : ""}"
            onclick="toggleFormEscape()"
          >${ESCAPE_TAG}</button>
        </div>
      </section>

      <section class="form-section">
        <div class="form-section-title">自由標籤</div>
        <div class="tag-entry">
          <input
            id="customTagInput"
            class="field"
            maxlength="${MAX_CUSTOM_TAG}"
            placeholder="自訂標籤（最多 ${MAX_CUSTOM_TAG} 字）"
            onkeydown="handleCustomTagKeydown(event)"
            style="width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:rgba(118,118,128,.06);"
          >
          <button class="small-btn" type="button" onclick="addCustomTag()">新增</button>
        </div>
        <div class="link-note">自由標籤只展示，不參與搜尋與篩選。</div>
        <div id="customTagPreview" class="tag-preview">
          ${renderFormCustomTags()}
        </div>
      </section>

      <section class="form-section">
        <div class="form-section-title">作品連結</div>
        <div id="linkEditorList" class="link-editor-list">
          ${renderLinkEditorRows()}
        </div>
        <button class="small-btn" style="margin-top:10px;padding:9px 12px;" type="button" onclick="addLinkRow()">＋ 新增作品連結</button>
        <div class="link-note">
分享書卡最多會顯示前 3 個有效作品網址。
        </div>
      </section>
    </div>

    <div class="form-footer">
      <button class="ghost-btn" type="button" onclick="closeModal()">取消</button>
      <button id="workSaveBtn" class="save-btn" type="button" onclick="saveWorkFromForm()">
        ${editing ? "儲存變更" : "新增作品"}
      </button>
    </div>
  `);

  bindFormLiveFields();
  updateWorkSaveButton();
}

function bindFormLiveFields() {
  ["formAuthor", "formTitle", "formSubtitle", "formHook", "formCopy", "formLastPublishedAt"]
    .forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener("input", () => {
        if (id === "formAuthor") formState.author = el.value;
        if (id === "formTitle") formState.title = el.value;
        if (id === "formSubtitle") formState.subtitle = [...el.value].slice(0, MAX_SUBTITLE).join("");
        if (id === "formHook") formState.hook = [...el.value].slice(0, MAX_HOOK).join("");
        if (id === "formCopy") formState.copy = el.value;
        if (id === "formLastPublishedAt") formState.lastPublishedAt = el.value;
        updateWorkSaveButton();
      });
    });
}

function updateHookCounter() {
  const input = document.getElementById("formHook");
  const counter = document.getElementById("hookCounter");
  if (!input || !counter) return;
  counter.textContent = `${[...input.value].length} / ${MAX_HOOK}`;
}

function updateSubtitleCounter() {
  const input = document.getElementById("formSubtitle");
  const counter = document.getElementById("subtitleCounter");
  if (!input || !counter) return;
  counter.textContent = `${[...input.value].length} / ${MAX_SUBTITLE}`;
}

function updateWorkSaveButton() {
  const btn = document.getElementById("workSaveBtn");
  if (!btn) return;
  btn.disabled =
    !formState.author.trim() ||
    !formState.title.trim() ||
    !formState.hook.trim();
}

function setFormStatus(status) {
  formState.status = status;
  if (status !== "停更中") formState.lastPublishedAt = "";
  renderWorkForm();
}

function toggleFormCreationType(type) {
  const set = new Set(formState.creationTypes);
  set.has(type) ? set.delete(type) : set.add(type);
  formState.creationTypes = [...set];
  renderWorkForm();
}

function toggleFormSeries(id) {
  const el = document.getElementById(`formSeries-${id}`);
  if (el) el.classList.toggle("show");
}

function toggleFormCategory(category) {
  const set = new Set(formState.categories);
  set.has(category) ? set.delete(category) : set.add(category);
  formState.categories = [...set];

  const btns = document.querySelectorAll(".series-children .check-chip");
  btns.forEach(btn => {
    if (btn.textContent.trim() === category) {
      btn.classList.toggle("active", set.has(category));
    }
  });

  /* 更新系列計數不必整張表單重畫，簡化操作 */
  SERIES.forEach(group => {
    const block = document.getElementById(`formSeries-${group.id}`)?.closest(".series-block");
    const label = block?.querySelector(".series-toggle span:last-child");
    if (label) {
      const count = group.options.filter(option => set.has(option)).length;
      label.textContent = count || "＋";
    }
  });
}

function toggleFormEscape() {
  formState.escape = !formState.escape;
  const btn = [...document.querySelectorAll(".escape-chip")]
    .find(node => node.textContent.trim() === ESCAPE_TAG && document.getElementById("modalCard").contains(node));
  if (btn) btn.classList.toggle("active", formState.escape);
}

function handleCustomTagKeydown(event) {
  if (event.key === "Enter" || event.key === ",") {
    event.preventDefault();
    addCustomTag();
  }
}

function addCustomTag() {
  const input = document.getElementById("customTagInput");
  if (!input) return;

  const value = [...input.value.trim()].slice(0, MAX_CUSTOM_TAG).join("");
  if (!value) return;

  if (!formState.customTags.includes(value)) {
    formState.customTags.push(value);
  }

  input.value = "";
  document.getElementById("customTagPreview").innerHTML = renderFormCustomTags();
}

function renderFormCustomTags() {
  return formState.customTags.map((tag, index) => `
    <span class="tag-edit-chip">
      ${escapeHTML(tag)}
      <button type="button" onclick="removeCustomTag(${index})">×</button>
    </span>
  `).join("");
}

function removeCustomTag(index) {
  formState.customTags.splice(index, 1);
  document.getElementById("customTagPreview").innerHTML = renderFormCustomTags();
}

function renderLinkEditorRows() {
  return formState.links.map((link, index) => `
    <div class="link-editor-row">
      <div class="link-editor-grid">
        <div class="field">
          <label>平台／網站名稱</label>
          <input
            value="${escapeAttr(link.label)}"
            placeholder="例如：角角者"
            oninput="updateLinkRow(${index}, 'label', this.value)"
          >
        </div>
        <div class="field">
          <label>作品網址</label>
          <input
            value="${escapeAttr(link.url)}"
            placeholder="https://..."
            oninput="updateLinkRow(${index}, 'url', this.value)"
          >
        </div>
      </div>

      <div class="link-row-actions">
        <button class="mini-btn" type="button" onclick="moveLinkRow(${index}, -1)" ${index === 0 ? "disabled" : ""}>↑</button>
        <button class="mini-btn" type="button" onclick="moveLinkRow(${index}, 1)" ${index === formState.links.length - 1 ? "disabled" : ""}>↓</button>
        <button class="mini-btn danger" type="button" onclick="removeLinkRow(${index})">刪除</button>
      </div>
    </div>
  `).join("");
}

function updateLinkRow(index, field, value) {
  if (!formState.links[index]) return;
  formState.links[index][field] = value;
}

function addLinkRow() {
  formState.links.push({ label: "", url: "" });
  document.getElementById("linkEditorList").innerHTML = renderLinkEditorRows();
}

function removeLinkRow(index) {
  formState.links.splice(index, 1);
  if (!formState.links.length) formState.links.push({ label: "", url: "" });
  document.getElementById("linkEditorList").innerHTML = renderLinkEditorRows();
}

function moveLinkRow(index, direction) {
  const target = index + direction;
  if (target < 0 || target >= formState.links.length) return;

  const copy = [...formState.links];
  [copy[index], copy[target]] = [copy[target], copy[index]];
  formState.links = copy;
  document.getElementById("linkEditorList").innerHTML = renderLinkEditorRows();
}

async function saveWorkFromForm() {
  if (!isAdmin) {
    showToast("請先登入管理者");
    return;
  }

  formState.author = document.getElementById("formAuthor")?.value.trim() || formState.author.trim();
  formState.title = document.getElementById("formTitle")?.value.trim() || formState.title.trim();
  formState.subtitle = [...(document.getElementById("formSubtitle")?.value.trim() || "")].slice(0, MAX_SUBTITLE).join("");
  formState.hook = [...(document.getElementById("formHook")?.value.trim() || "")].slice(0, MAX_HOOK).join("");
  formState.copy = document.getElementById("formCopy")?.value.trim() || "";

  if (formState.status === "停更中") {
    formState.lastPublishedAt =
      document.getElementById("formLastPublishedAt")?.value || "";
  } else {
    formState.lastPublishedAt = "";
  }

  if (!formState.author || !formState.title || !formState.hook) {
    showToast("作者、書名與一句話簡介為必填");
    return;
  }

  formState.links = formState.links
    .map(link => ({
      label: String(link.label || "").trim(),
      url: String(link.url || "").trim()
    }))
    .filter(link => link.label || link.url);

  const saveBtn = document.getElementById("workSaveBtn");
  if (saveBtn) {
    saveBtn.disabled = true;
    saveBtn.textContent = formState.id ? "儲存中…" : "新增中…";
  }

  try {
    if (formState.id) {
      const saved = await updateWorkInDatabase(normalizeWork(formState));
      const index = works.findIndex(work => String(work.id) === String(saved.id));
      if (index >= 0) works[index] = saved;
      showToast("作品已更新");
    } else {
      const saved = await insertWork(normalizeWork(formState));
      works.unshift(saved);
      currentPage = 1;
      showToast("作品已新增");
    }

    closeModal();
    renderAll();
  } catch (error) {
    console.error("作品儲存失敗", error);
    showToast("作品儲存失敗，請確認登入狀態與資料庫欄位");
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.textContent = formState.id ? "儲存變更" : "新增作品";
    }
  }
}

async function deleteWork(id) {
  if (!isAdmin) {
    showToast("請先登入管理者");
    return;
  }

  const work = findWork(id);
  if (!work) return;

  openModal(`
    <div class="modal-head">
      <h3>刪除作品</h3>
      <button class="icon-btn" type="button" onclick="closeModal()">×</button>
    </div>

    <div class="modal-body">
      <p style="margin:0;line-height:1.8;color:var(--text);">
        確定要刪除《${escapeHTML(work.title)}》嗎？
      </p>

      <p style="margin:10px 0 0;line-height:1.8;color:var(--danger);font-size:12px;">
        刪除後無法復原。
      </p>
    </div>

    <div class="form-footer">
      <button class="ghost-btn" type="button" onclick="closeModal()">取消</button>
      <button
        class="save-btn"
        type="button"
        onclick="confirmDeleteWork('${work.id}')"
        style="background:var(--danger);"
      >確定刪除</button>
    </div>
  `, true);
}

async function confirmDeleteWork(id) {
  if (!isAdmin) {
    closeModal();
    showToast("請先登入管理者");
    return;
  }

  const work = findWork(id);
  if (!work) {
    closeModal();
    return;
  }

  try {
    await deleteWorkFromDatabase(work.id);

    works = works.filter(
      item => String(item.id) !== String(work.id)
    );

    closeModal();
    closeDetail();
    renderAll();
    showToast("作品已刪除");
  } catch (error) {
    console.error("刪除作品失敗", error);
    showToast("刪除作品失敗，請確認登入狀態");
  }
}

/* -------------------- 啟動 -------------------- */

async function init() {
  try {
    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error) throw error;

    currentSession = data.session || null;

    if (
      currentSession &&
      currentSession.user &&
      currentSession.user.id === ADMIN_UID
    ) {
      isAdmin = true;
    } else {
      if (currentSession) {
        await supabaseClient.auth.signOut();
      }
      currentSession = null;
      isAdmin = false;
    }
  } catch (error) {
    console.error("讀取登入狀態失敗", error);
    currentSession = null;
    isAdmin = false;
  }

  renderAdminState();
  renderFilters();
  await loadWorks();
}

supabaseClient.auth.onAuthStateChange((event, session) => {
  currentSession = session;

  if (session?.user?.id === ADMIN_UID) {
    isAdmin = true;
  } else {
    isAdmin = false;
  }

  renderAdminState();

  if (!loadingWorks) {
    renderBookList();

    if (activeDetailId) {
      openDetail(activeDetailId, false);
    }
  }

  /* 從 Supabase 密碼重設信回來 */
  if (
    event === "PASSWORD_RECOVERY" &&
    session?.user?.id === ADMIN_UID
  ) {
    setTimeout(() => {
      openPasswordReset();
    }, 100);
  }
});

init();


</script>
</body>
</html>
