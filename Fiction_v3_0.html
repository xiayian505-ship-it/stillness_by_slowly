<body>

      </div>

      <div id="bookList" class="book-list"></div>

  <footer>

<span>

</span>

<div class="footer-signature">

<script>
/* =========================================================
   Supabase 後端版
========================================================= */

const CREATION_TYPES = ["原創", "同人", "改編"];

const SERIES = [
  { id: "romance", label: "戀愛系列", options: ["戀愛系列", "戀愛", "耽美", "言情", "百合"] },

  { id: "era", label: "時代背景", options: ["時代背景", "古風", "現代", "未來", "末日"] },

  { id: "fantasy", label: "奇幻系列", options: ["奇幻系列", "東方奇幻", "西方奇幻", "現代奇幻"] },

  { id: "xuanhuan", label: "玄幻系列", options: ["玄幻系列", "東方玄幻", "現代玄幻", "架空玄幻"] },

  { id: "wuxia", label: "武俠仙俠系列", options: ["武俠仙俠系列", "武俠", "仙俠"] },

  { id: "mystery", label: "推理系列", options: ["推理系列", "一般推理", "特殊設定推理"] },

  { id: "crime", label: "犯罪系列", options: ["犯罪系列", "犯罪", "犯罪心理"] },

  { id: "investigation", label: "刑偵系列", options: ["刑偵系列", "刑偵", "調查", "辦案"] },

  { id: "suspense", label: "懸疑系列", options: ["懸疑系列", "懸疑", "驚悚"] },

  { id: "supernatural", label: "靈異系列", options: ["靈異系列", "靈異", "恐怖"] },

  { id: "transmigration", label: "穿越系列", options: ["穿越系列", "穿越", "重生", "穿書"] },

  { id: "scifi", label: "科幻系列", options: ["科幻系列", "一般科幻", "未來科技", "星際宇宙"] },

  { id: "history", label: "歷史系列", options: ["歷史系列", "真實歷史", "架空歷史"] },

  { id: "game", label: "遊戲系列", options: ["遊戲系列", "遊戲", "電競", "網遊"] },

  { id: "military", label: "戰爭軍事系列", options: ["戰爭軍事系列", "戰爭軍事", "陸軍", "海軍", "空軍", "海軍陸戰隊"] },

  { id: "worldview", label: "世界觀設定", options: ["世界觀設定", "ABO", "哨兵嚮導"] },

  { id: "sports", label: "運動系列", options: ["運動系列", "球類運動", "格鬥運動", "水上運動", "田徑運動", "其他運動"] },

  { id: "psychology", label: "心理系列", options: ["心理系列", "心理", "心理療癒", "心理創傷"] }
];



const ESCAPE_TAG = "我也不知道怎麼分類";
const STATUS_OPTIONS = ["連載中", "已完結", "停更中"];
const MAX_HOOK = 30;
const MAX_SUBTITLE = 16;
const MAX_CUSTOM_TAG = 16;

/* =========================================================
   Supabase
========================================================= */

const SUPABASE_URL =
  "https://bkjqaetxwvcdciieevvs.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_dAHoIimWgbGAF2wtIVSZfg_V8rzc200";

const ADMIN_UID =
  "372c6a7f-4e6b-49fa-8228-183b46cbdede";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

let currentSession = null;
let loadingWorks = true;

const SAMPLE_WORKS = [];

let works = [];
let authors = [];
let loadingAuthors = true;
let searchText = "";
let selectedCreationTypes = new Set();
let selectedCategories = new Set();
let selectedAuthor = "";
let selectedAuthorId = null;
let escapeFilter = false;
let openSeriesId = "";
let activeDetailId = null;
let isAdmin = false;
/* -------------------- 分頁一次12本 -------------------- */
const PAGE_SIZE = 12;
let currentPage = 1;
let sortMode = "random";
let formState = null;
let randomOrder = [];

/* -------------------- 工具 -------------------- */

function cryptoRandomId() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return "w-" + Date.now() + "-" + Math.random().toString(36).slice(2, 9);
}

function escapeHTML(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttr(value) {
  return escapeHTML(value).replace(/`/g, "&#096;");
}

function normalizeWork(raw) {
  return {
    id: raw.id || cryptoRandomId(),
    authorId: raw.authorId ?? null,
    author: String(raw.author || "").trim(),
    title: String(raw.title || "").trim(),
    subtitle: [...String(raw.subtitle || "").trim()].slice(0, MAX_SUBTITLE).join(""),
    hook: String(raw.hook || "").slice(0, MAX_HOOK),
    copy: String(raw.copy || ""),
    status: STATUS_OPTIONS.includes(raw.status) ? raw.status : "連載中",
    lastPublishedAt: raw.status === "停更中" ? String(raw.lastPublishedAt || "") : "",
    creationTypes: Array.isArray(raw.creationTypes)
      ? raw.creationTypes.filter(x => CREATION_TYPES.includes(x))
      : [],
    categories: Array.isArray(raw.categories)
      ? raw.categories.filter(isValidCategory)
      : [],
    escape: Boolean(raw.escape),
    customTags: Array.isArray(raw.customTags)
      ? raw.customTags
          .map(x => String(x).trim().slice(0, MAX_CUSTOM_TAG))
          .filter(Boolean)
      : [],
    links: Array.isArray(raw.links)
      ? raw.links
          .map(link => ({
            label: String(link?.label || "").trim(),
            url: String(link?.url || "").trim()
          }))
          .filter(link => link.label || link.url)
      : [],
    createdAt: raw.createdAt || new Date().toISOString()
  };
}

function isValidCategory(value) {
  return SERIES.some(group => group.options.includes(value));
}

function rowToWork(row) {
  return normalizeWork({
    id: row.id,
    authorId: row.author_id,
    author: row.author,
    title: row.title,
    subtitle: row.subtitle,
    hook: row.hook,
    copy: row.copy,
    status: row.status,
    lastPublishedAt: row.last_published_at,
    creationTypes: row.creation_types,
    categories: row.categories,
    escape: row.escape,
    customTags: row.custom_tags,
    links: row.links,
    createdAt: row.created_at
  });
}

function workToRow(work) {
  return {
    author_id: work.authorId ?? null,
    author: work.author || "",
    title: work.title || "",
    subtitle: work.subtitle || "",
    hook: work.hook || "",
    copy: work.copy || "",
    status: work.status || "連載中",
    last_published_at:
      work.status === "停更中" && work.lastPublishedAt
        ? work.lastPublishedAt
        : null,
    creation_types: Array.isArray(work.creationTypes)
      ? work.creationTypes
      : [],
    categories: Array.isArray(work.categories)
      ? work.categories
      : [],
    escape: Boolean(work.escape),
    custom_tags: Array.isArray(work.customTags)
      ? work.customTags
      : [],
    links: Array.isArray(work.links)
      ? work.links
      : []
  };
}

async function loadAuthors() {
  loadingAuthors = true;

  try {
    const { data, error } =
      await supabaseClient
        .from("authors")
        .select("*")
        .order("created_at", { ascending: true });

    if (error) throw error;

    authors = data || [];
  } catch (error) {
    console.error("讀取作者資料失敗", error);
    authors = [];
    showToast("作者資料讀取失敗");
  } finally {
    loadingAuthors = false;
  }
}

async function loadWorks() {
  loadingWorks = true;
  renderBookList();

  try {
    const { data, error } =
      await supabaseClient
        .from("works")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) throw error;

    works = (data || []).map(rowToWork);
    if (!isAdmin && sortMode === "random") {
  randomOrder = shuffleWorks(works);
}
  } catch (error) {
    console.error("讀取作品失敗", error);
    works = [];
    showToast("作品資料讀取失敗");
  } finally {
    loadingWorks = false;
    renderAll();

    const workIdFromUrl =
      new URL(location.href).searchParams.get("work");

    if (workIdFromUrl && findWork(workIdFromUrl)) {
      setTimeout(() => openDetail(workIdFromUrl, false), 60);
    }
  }
}

async function insertWork(work) {
  const { data, error } =
    await supabaseClient
      .from("works")
      .insert(workToRow(work))
      .select("*")
      .single();

  if (error) throw error;
  if (!isAdmin && sortMode === "random") {
  randomOrder = shuffleWorks(works);
}
  return rowToWork(data);
}

async function updateWorkInDatabase(work) {
  const { data, error } =
    await supabaseClient
      .from("works")
      .update(workToRow(work))
      .eq("id", work.id)
      .select("*")
      .single();

  if (error) throw error;
  return rowToWork(data);
}

async function deleteWorkFromDatabase(id) {
  const { error } =
    await supabaseClient
      .from("works")
      .delete()
      .eq("id", id);

  if (error) throw error;
}

function findWork(id) {
  return works.find(work => String(work.id) === String(id)) || null;
}

function findAuthorById(id) {
  return authors.find(author => String(author.id) === String(id)) || null;
}

function getAuthorWorkCount(authorId) {
  if (!authorId) return 0;

  return works.filter(
    work => String(work.authorId) === String(authorId)
  ).length;
}

async function previewAuthorCard(authorId) {
  const author = findAuthorById(authorId);

  if (!author) {
    showToast("找不到作者資料");
    return;
  }

  const workCount = getAuthorWorkCount(authorId);

  const width = 820;
  const height = 450;

  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;

  const ctx = canvas.getContext("2d");

  /* 背景：完全沿用作品書卡 */
  ctx.fillStyle = "#D9E8EB";
  ctx.fillRect(0, 0, width, height);

  /* 主卡 */
  roundedRect(ctx, 24, 24, width - 48, height - 48, 28);
  ctx.fillStyle = "#EDF5F6";
  ctx.fill();

  const left = 58;
  const contentW = width - 116;
  let y = 88;

  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";

  /* 作者名稱：對應原本書名 */
  ctx.fillStyle = "#1F2C30";
  ctx.font = '700 40px "Noto Serif TC", serif';

  y = drawWrappedText(
    ctx,
    author.name || "未命名作者",
    left,
    y,
    contentW,
    58,
    1
  );

  /* 本站收錄：對應原本作者欄 */
  y += 46;

  ctx.fillStyle = "#7D9196";
  ctx.font = '600 17px "Noto Sans TC", sans-serif';
  ctx.fillText("本站收錄", left, y);

  ctx.fillStyle = "#1F2C30";
  ctx.font = '700 20px "Noto Sans TC", sans-serif';
  ctx.fillText(`${workCount} 部作品`, left + 92, y);

  /* 個人網站：對應原本分類區 */
  y += 48;

  ctx.fillStyle = "#7D9196";
  ctx.font = '600 15px "Noto Sans TC", sans-serif';
  ctx.fillText("個人網站", left, y);

  ctx.fillStyle = "#60747A";
  ctx.font = '500 14px "Noto Sans TC", sans-serif';

  const website = String(author.website || "").trim();

  if (website) {
    const websiteX = left + 82;
    const maxWebsiteWidth = contentW - 82;

    let displayWebsite = website;

    while (
      ctx.measureText(displayWebsite).width > maxWebsiteWidth &&
      displayWebsite.length > 4
    ) {
      displayWebsite = displayWebsite.slice(0, -1);
    }

    if (displayWebsite !== website) {
      displayWebsite = displayWebsite.slice(0, -1) + "…";
    }

    ctx.fillText(displayWebsite, websiteX, y);
  } else {
    ctx.fillText("未提供個人網站", left + 82, y);
  }

  /* 作者簡介：對應原本作品網址區 */
  y += 48;

  ctx.fillStyle = "#7D9196";
  ctx.font = '600 15px "Noto Sans TC", sans-serif';
  ctx.fillText("作者簡介", left, y);

  ctx.fillStyle = "#1F2C30";
  ctx.font = '500 16px "Noto Sans TC", sans-serif';

  const bio = String(author.bio || "").trim();

  if (bio) {
    drawWrappedText(
      ctx,
      bio,
      left + 82,
      y,
      contentW - 82,
      28,
      2
    );
  } else {
    ctx.fillStyle = "#60747A";
    ctx.fillText("未提供作者簡介", left + 82, y);
  }

  /* 底部品牌：完全沿用作品書卡 */
  ctx.strokeStyle = "rgba(43,76,84,.14)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(58, 350);
  ctx.lineTo(width - 58, 350);
  ctx.stroke();

  ctx.fillStyle = "#7D9196";
  ctx.font = '600 17px "Noto Serif TC", serif';
  ctx.fillText("慢 慢", 58, 398);

  const logoWidth = ctx.measureText("慢 慢").width;

  ctx.font =
    '500 16px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif';

  ctx.fillText(
    " | stillness by slowly",
    58 + logoWidth + 5,
    398
  );

  ctx.textAlign = "right";
  ctx.fillStyle = "#7D9196";
  ctx.font = '500 14px "Noto Sans TC", sans-serif';
  ctx.fillText("作品探索", width - 58, 398);
  ctx.textAlign = "left";

  /* 產生 PNG */
  const blob = await new Promise(resolve =>
    canvas.toBlob(resolve, "image/png")
  );

  if (!blob) {
    showToast("作者名片產生失敗");
    return;
  }

  const previewUrl = URL.createObjectURL(blob);

  const safeName = (author.name || "作者")
    .replace(/[\\/:*?"<>|]/g, "_")
    .trim();

  /* 沿用現有 shareCardPreview */
  window.shareCardPreview = {
    blob,
    url: previewUrl,
    filename: `${safeName}_作者名片.png`
  };

  /* 沿用作品書卡的預覽 Modal */
  openModal(`
    <div class="modal-head">
      <h3>作者名片預覽</h3>

      <button
        class="icon-btn"
        type="button"
        onclick="closeShareCardPreview()"
      >×</button>
    </div>

    <div class="modal-body">
      <img
        src="${previewUrl}"
        alt="${escapeAttr(author.name || "作者")} 作者名片"
        style="
          display:block;
          width:100%;
          height:auto;
          border-radius:16px;
        "
      >
    </div>

    <div class="form-footer">
      <button
        class="ghost-btn"
        type="button"
        onclick="closeShareCardPreview()"
      >取消</button>

      <button
        class="save-btn"
        type="button"
        onclick="confirmShareCardDownload()"
      >下載 PNG</button>
    </div>
  `);
}

function showToast(message) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove("show"), 2100);
}

function getAllSystemTags(work) {
  return [...(work.creationTypes || []), ...(work.categories || [])];
}

function filterWorks() {
  const q = searchText.trim().toLocaleLowerCase("zh-Hant");

  return works.filter(work => {
    const searchBlob = [
      work.title,
      work.subtitle,
      work.author,
      work.hook,
      work.copy
    ].join(" ").toLocaleLowerCase("zh-Hant");

    const searchOk = !q || searchBlob.includes(q);
    const authorOk = !selectedAuthor || work.author === selectedAuthor;

    /* 創作類型 / 系統分類採 AND：選越多，結果越精準 */
    const creationOk =
      selectedCreationTypes.size === 0 ||
      [...selectedCreationTypes].every(tag => work.creationTypes.includes(tag));

    const categoriesOk =
      selectedCategories.size === 0 ||
      [...selectedCategories].every(tag => work.categories.includes(tag));

    const escapeOk = !escapeFilter || work.escape;

    return searchOk && authorOk && creationOk && categoriesOk && escapeOk;
  });
}

function goHome() {
  closeDetail(false);

  searchText = "";
  selectedCreationTypes.clear();
  selectedCategories.clear();
  selectedAuthor = "";
  escapeFilter = false;
  selectedAuthorId = null;
  openSeriesId = "";
  currentPage = 1;

  const searchInput = document.getElementById("searchInput");
  if (searchInput) searchInput.value = "";
  const searchClear = document.getElementById("searchClear");
  if (searchClear) searchClear.classList.remove("show");

  const url = new URL(location.href);
  url.searchParams.delete("work");
  history.replaceState(null, "", url);

  renderAll();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* -------------------- 篩選 UI -------------------- */

function renderFilters() {
  const creationContainer = document.getElementById("creationTypeOptions");
  creationContainer.innerHTML = [
    ...CREATION_TYPES.map(type => `
      <button
        type="button"
        class="check-chip ${selectedCreationTypes.has(type) ? "active" : ""}"
        onclick="toggleCreationType('${escapeAttr(type)}')"
      >${escapeHTML(type)}</button>
    `),
    `
      <button
        type="button"
        class="check-chip escape-chip ${escapeFilter ? "active" : ""}"
        onclick="toggleEscapeFilter()"
      >${ESCAPE_TAG}</button>
    `
  ].join("");

  const triggerContainer = document.getElementById("seriesTriggers");
  triggerContainer.innerHTML = SERIES.map(group => {
    const count = group.options.filter(option => selectedCategories.has(option)).length;
    return `
      <button
        type="button"
        class="filter-trigger ${openSeriesId === group.id || count ? "active" : ""}"
        onclick="toggleSeries('${group.id}')"
      >
        ${escapeHTML(group.label)}
        ${count ? `<span class="count">${count}</span>` : ""}
      </button>
    `;
  }).join("");

  const drawers = document.getElementById("seriesDrawers");
  drawers.innerHTML = SERIES.map(group => `
    <div class="filter-drawer ${openSeriesId === group.id ? "show" : ""}">
      <div class="filter-options">
        ${group.options.map(option => `
          <button
            type="button"

function toggleCreationType(type) {

}

function toggleCategory(category) {

function toggleEscapeFilter() {

function setAuthorFilter(author, authorId = null) {

  });

  document.getElementById("oldestSortBtn")?.classList.add("active");

  renderBookList();

function shuffleWorks(items) {
  const shuffled = [...items];

  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }

  return shuffled.map(work => work.id);
}

function sortRandom() {
  sortMode = "random";
  currentPage = 1;
  
  randomOrder = shuffleWorks(filterWorks())

  document.querySelectorAll(".sort-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  document.getElementById("randomSortBtn")?.classList.add("active");

  renderBookList();
}

/* -------------------- 作品列表 -------------------- */

function renderBookList() {
  const list = document.getElementById("bookList");

  if (loadingWorks) {
    document.getElementById("resultCount").textContent = "正在讀取作品…";
    list.innerHTML = `
      <div class="empty-state">
        <strong>正在讀取作品資料</strong>
        請稍候一下。
      </div>
    `;
    return;
  }

let filtered = filterWorks();

if (!isAdmin && sortMode === "newest") {
  filtered = [...filtered].sort((a, b) => Number(b.id) - Number(a.id));
}

if (!isAdmin && sortMode === "oldest") {
  filtered = [...filtered].sort((a, b) => Number(a.id) - Number(b.id));
}

if (!isAdmin && sortMode === "random" && randomOrder.length) {
  const orderMap = new Map(
    randomOrder.map((id, index) => [String(id), index])
  );

  filtered = [...filtered].sort((a, b) => {
    return (
      (orderMap.get(String(a.id)) ?? Infinity) -
      (orderMap.get(String(b.id)) ?? Infinity)
    );
  });
}

  const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));

if (currentPage > totalPages) currentPage = totalPages;

const startIndex = (currentPage - 1) * PAGE_SIZE;
const pagedWorks = filtered.slice(startIndex, startIndex + PAGE_SIZE);
renderPagination(totalPages);
  document.getElementById("resultCount").textContent =
    `${filtered.length} 部作品${works.length !== filtered.length ? `／共 ${works.length} 部` : ""}`;

  if (!filtered.length) {
    list.innerHTML = `
      <div class="empty-state">
        <strong>目前沒有符合條件的作品</strong>
        換個關鍵字或取消部分篩選看看。
      </div>
    `;
    return;
  }

  list.innerHTML = pagedWorks.map((work, index) => {
    const systemTags = getAllSystemTags(work);
    return `
      <article class="book-row" onclick="openDetail('${work.id}')">
        <div class="book-index">${String(startIndex + index + 1).padStart(3, "0")}</div>

        <div class="book-main">
          <h3 class="book-title">${escapeHTML(work.title)}</h3>
          ${work.subtitle ? `<div class="book-subtitle">${escapeHTML(work.subtitle)}</div>` : ""}
          <p class="book-hook">${escapeHTML(work.hook || "尚未填寫一句話故事簡介。")}</p>

          <div class="book-meta">
            <button
              class="author-link"
              type="button"
onclick="event.stopPropagation(); setAuthorFilter('${escapeAttr(work.author)}', '${escapeAttr(work.authorId ?? "")}')"
            >${escapeHTML(work.author || "未署名")}</button>

            ${systemTags.slice(0, 5).map(tag => `
              <button
                class="system-tag"
                type="button"
                onclick="event.stopPropagation(); applySystemTag('${escapeAttr(tag)}')"
              >${escapeHTML(tag)}</button>
            `).join("")}
            ${systemTags.length > 5 ? `<span class="system-tag">＋${systemTags.length - 5}</span>` : ""}
          </div>
        </div>

        <div class="book-side">
          <span class="status-badge status-${escapeAttr(work.status)}">${escapeHTML(work.status)}</span>
          <span class="row-arrow">›</span>
        </div>
      </article>
    `;
  }).join("");
}

function renderPagination(totalPages) {
  const box = document.getElementById("pagination");

  if (totalPages <= 1) {
    box.innerHTML = "";
    return;
  }

  box.innerHTML = `
<button type="button" onclick="changePage(-1)" ${currentPage === 1 ? "disabled" : ""}>上一頁</button>
  <span>${currentPage} / ${totalPages}</span>
<button type="button" onclick="changePage(1)" ${currentPage === totalPages ? "disabled" : ""}>下一頁</button>
`;
}

function changePage(direction) {
  const nextPage = currentPage + direction;
  const totalPages = Math.max(1, Math.ceil(filterWorks().length / PAGE_SIZE));

  if (nextPage < 1 || nextPage > totalPages) return;

  currentPage = nextPage;
  renderAll();

  document.querySelector(".index-toolbar")?.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

function applySystemTag(tag) {
  if (CREATION_TYPES.includes(tag)) {
    selectedCreationTypes.add(tag);
  } else if (isValidCategory(tag)) {
    selectedCategories.add(tag);
  }

  currentPage = 1;

  closeDetail();
  renderAll();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function formatDate(value) {
  if (!value) return "";
  const d = new Date(value + "T00:00:00");
  if (Number.isNaN(d.getTime())) return value;
  return new Intl.DateTimeFormat("zh-Hant", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).format(d);
}

function safeUrl(url) {
  const value = String(url || "").trim();
  if (/^https?:\/\//i.test(value)) return value;
  return "#";
}

/* -------------------- 分享 -------------------- */

function getWorkShareUrl(work) {
  const url = new URL(location.href);
  url.search = "";
  url.hash = "";
  url.searchParams.set("work", work.id);
  return url.toString();
}

async function copyShareUrl(shareUrl) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(shareUrl);
      showToast("作品連結已複製");
      return true;
    }
  } catch (error) {
    console.warn("Clipboard API 無法使用", error);
  }

  try {
    const input = document.createElement("textarea");
    input.value = shareUrl;
    input.setAttribute("readonly", "");
    input.style.position = "fixed";
    input.style.opacity = "0";
    document.body.appendChild(input);
    input.select();
    input.setSelectionRange(0, input.value.length);
    const copied = document.execCommand("copy");
    input.remove();

    if (copied) {
      showToast("作品連結已複製");
      return true;
    }
  } catch (error) {
    console.warn("備用複製方式無法使用", error);
  }

  window.prompt("複製作品連結", shareUrl);
  return false;
}

async function shareWork(id) {
  const work = findWork(id);
  if (!work) return;

  const shareUrl = getWorkShareUrl(work);
  const shareData = {
    title: work.title,
    text: [work.title, work.subtitle, work.hook].filter(Boolean).join("\n"),
    url: shareUrl
  };

  if (typeof navigator.share === "function") {
    try {
      if (!navigator.canShare || navigator.canShare(shareData)) {
        await navigator.share(shareData);
        return;
      }
    } catch (error) {
      if (error?.name === "AbortError") return;
      console.warn("系統分享失敗，改用複製連結", error);
    }
  }

  await copyShareUrl(shareUrl);
}

async function downloadShareCard(id) {
  const work = findWork(id);
  if (!work) return;

  const width = 820;
  const height = 450;
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");

  /* 背景 */
  ctx.fillStyle = "#D9E8EB";
  ctx.fillRect(0, 0, width, height);

  /* 主卡：偏實體書籤比例 */
  roundedRect(ctx, 24, 24, width - 48, height - 48, 28);
  ctx.fillStyle = "#EDF5F6";
  ctx.fill();

  const left = 58;
  const contentW = width - 116;
  let y = 88;

  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";

  /* 書名 */
  ctx.fillStyle = "#1F2C30";
  ctx.font = '700 40px "Noto Serif TC", serif';
  y = drawWrappedText(ctx, work.title, left, y, contentW, 58, 1);

  /* 副標 */
  if (work.subtitle) {
    ctx.fillStyle = "#60747A";
    ctx.font = '500 21px "Noto Sans TC", sans-serif';
    y += 34;
    y = drawWrappedText(
      ctx,
      [...work.subtitle].slice(0, MAX_SUBTITLE).join(""),
      left,
      y,
      contentW,
      36,
      1
    );
  }

  /* 作者 */
  y += 46;
  ctx.fillStyle = "#7D9196";
  ctx.font = '600 17px "Noto Sans TC", sans-serif';
  ctx.fillText("作者", left, y);

  ctx.fillStyle = "#1F2C30";
  ctx.font = '700 20px "Noto Sans TC", sans-serif';
  ctx.fillText(work.author || "未署名", left + 62, y);

  /* 分類 */
  const tags = getAllSystemTags(work).slice(0, 6);
  y += 48;
  ctx.fillStyle = "#60747A";
  ctx.font = '500 17px "Noto Sans TC", sans-serif';
  y = drawWrappedText(
    ctx,
    tags.join("  ·  "),
    left,
    y,
    contentW,
    30,
    1
  );

  /* 作品網址：最多顯示 3 個平台 */
  const shareLinks = work.links
    .filter(link => /^https?:\/\//i.test(link.url || ""))
    .slice(0, 3);

  y += 38;

  ctx.fillStyle = "#7D9196";
  ctx.font = '600 15px "Noto Sans TC", sans-serif';
  ctx.fillText("作品網址", left, y);

  if (shareLinks.length) {
    shareLinks.forEach((link, index) => {
      const linkY = y + index * 24;

      /* 平台名稱 */
      ctx.fillStyle = "#1F2C30";
      ctx.font = '600 14px "Noto Sans TC", sans-serif';

      const platformName = link.label || "作品連結";
      ctx.fillText(platformName, left + 82, linkY);

      /* 網址 */
      const platformWidth = ctx.measureText(platformName).width;

      ctx.fillStyle = "#60747A";
      ctx.font = '500 13px "Noto Sans TC", sans-serif';

      const urlX = left + 82 + platformWidth + 12;
      const maxUrlWidth = contentW - (urlX - left);

      let displayUrl = link.url;

      while (
        ctx.measureText(displayUrl).width > maxUrlWidth &&
        displayUrl.length > 4
      ) {
        displayUrl = displayUrl.slice(0, -1);
      }

      if (displayUrl !== link.url) {
        displayUrl = displayUrl.slice(0, -1) + "…";
      }

      ctx.fillText(displayUrl, urlX, linkY);
    });
  } else {
    ctx.fillStyle = "#60747A";
    ctx.font = '500 14px "Noto Sans TC", sans-serif';
    ctx.fillText("未提供作品網址", left + 82, y);
  }

  /* 底部品牌 */
  ctx.strokeStyle = "rgba(43,76,84,.14)";
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(58, 350);
  ctx.lineTo(width - 58, 350);
  ctx.stroke();

  ctx.fillStyle = "#7D9196";
  ctx.font = '600 17px "Noto Serif TC", serif';
  ctx.fillText("慢 慢", 58, 398);

  const logoWidth = ctx.measureText("慢 慢").width;
  ctx.font = '500 16px -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif';
  ctx.fillText(" | stillness by slowly", 58 + logoWidth + 5, 398);

  ctx.textAlign = "right";
  ctx.fillStyle = "#7D9196";
  ctx.font = '500 14px "Noto Sans TC", sans-serif';
  ctx.fillText("作品探索", width - 58, 398);
  ctx.textAlign = "left";

  /* 產生 PNG */
  const blob = await new Promise(resolve =>
    canvas.toBlob(resolve, "image/png")
  );

  if (!blob) {
    showToast("書卡產生失敗");
    return;
  }

  const previewUrl = URL.createObjectURL(blob);

  const safeName = (work.title || "作品")
    .replace(/[\\/:*?"<>|]/g, "_")
    .trim();

  /* 暫存圖片，等使用者確認後才下載 */
  window.shareCardPreview = {
    blob,
    url: previewUrl,
    filename: `${safeName}_分享書卡.png`
  };

  /* 開啟預覽 */
  openModal(`
    <div class="modal-head">
      <h3>分享書卡預覽</h3>
      <button
        class="icon-btn"
        type="button"
        onclick="closeShareCardPreview()"
      >×</button>
    </div>

    <div class="modal-body">
      <img
        src="${previewUrl}"
        alt="${escapeAttr(work.title)} 分享書卡"
        style="
          display:block;
          width:100%;
          height:auto;
          border-radius:16px;
        "
      >
    </div>

    <div class="form-footer">
      <button
        class="ghost-btn"
        type="button"
        onclick="closeShareCardPreview()"
      >取消</button>

      <button
        class="save-btn"
        type="button"
        onclick="confirmShareCardDownload()"
      >下載 PNG</button>
    </div>
  `);
}

function confirmShareCardDownload() {
  const data = window.shareCardPreview;
  if (!data) return;

  const a = document.createElement("a");
  a.href = data.url;
  a.download = data.filename;
  document.body.appendChild(a);
  a.click();
  a.remove();

  closeShareCardPreview();
}

function closeShareCardPreview() {
  const data = window.shareCardPreview;

  if (data?.url) {
    URL.revokeObjectURL(data.url);
  }

  window.shareCardPreview = null;
  closeModal();
}

function roundedRect(ctx, x, y, w, h, r) {
  const radius = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + w, y, x + w, y + h, radius);
  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);
  ctx.arcTo(x, y, x + w, y, radius);
  ctx.closePath();
}

function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines = Infinity) {
  const chars = [...String(text || "")];
  let line = "";
  let lines = [];

  for (const ch of chars) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = ch;
      if (lines.length >= maxLines) break;
    } else {
      line = test;
    }
  }

  if (line && lines.length < maxLines) lines.push(line);

  if (lines.length === maxLines && chars.join("") !== lines.join("")) {
    let last = lines[lines.length - 1];
    while (ctx.measureText(last + "…").width > maxWidth && last.length) {
      last = last.slice(0, -1);
    }
    lines[lines.length - 1] = last + "…";
  }

  lines.forEach((lineText, index) => {
    ctx.fillText(lineText, x, y + index * lineHeight);
  });

  return y + Math.max(0, lines.length - 1) * lineHeight;
}

function sanitizeFilename(name) {
  return String(name).replace(/[\\/:*?"<>|]/g, "_").trim() || "作品";
}

async function confirmPasswordReset() {
  const password =
    document.getElementById("resetPassword")?.value || "";

  const confirmPassword =
    document.getElementById("resetPasswordConfirm")?.value || "";

  const errorBox =
    document.getElementById("resetPasswordError");

  const btn =
    document.getElementById("resetPasswordBtn");

  if (!password || !confirmPassword) {
    if (errorBox) {
      errorBox.textContent = "請輸入新密碼。";
    }
    return;
  }

  if (password !== confirmPassword) {
    if (errorBox) {
      errorBox.textContent = "兩次輸入的密碼不一致。";
    }
    return;
  }

  if (password.length < 8) {
    if (errorBox) {
      errorBox.textContent = "密碼至少需要 8 個字元。";
    }
    return;
  }

  if (errorBox) errorBox.textContent = "";

  if (btn) {
    btn.disabled = true;
    btn.textContent = "修改中…";
  }

  try {
    const { error } =
      await supabaseClient.auth.updateUser({
        password
      });

    if (error) throw error;

    closeModal();

    showToast("密碼已更新");

    /* 改完直接登出，讓新密碼重新登入一次 */
    await supabaseClient.auth.signOut();

    currentSession = null;
    isAdmin = false;

    renderAdminState();
    renderBookList();

  } catch (error) {
    console.error("修改密碼失敗", error);

    if (errorBox) {
      errorBox.textContent =
        "修改密碼失敗，請重新寄送密碼重設信後再試一次。";
    }

    if (btn) {
      btn.disabled = false;
      btn.textContent = "修改密碼";
    }
  }
}

async function loginAdmin() {
  const email = document.getElementById("loginEmail")?.value.trim() || "";
  const password = document.getElementById("loginPassword")?.value || "";
  const errorBox = document.getElementById("loginError");

  if (!email || !password) {
    if (errorBox) errorBox.textContent = "請輸入 Email 與密碼。";
    return;
  }

  if (errorBox) errorBox.textContent = "";

  try {
    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) throw error;

    if (!data.user || data.user.id !== ADMIN_UID) {
      await supabaseClient.auth.signOut();
      currentSession = null;
      isAdmin = false;
      if (errorBox) errorBox.textContent = "此帳號沒有管理權限。";
      return;
    }

    currentSession = data.session;
    isAdmin = true;

    closeModal();
    renderAdminState();
    renderBookList();
    if (activeDetailId) openDetail(activeDetailId, false);
    showToast("已進入管理模式");
  } catch (error) {
    console.error("登入失敗", error);
    if (errorBox) {
      errorBox.textContent = "登入失敗，請確認 Email 或密碼是否正確。";
    }
  }
}

async function logoutAdmin() {
  try {
    await supabaseClient.auth.signOut();
  } catch (error) {
    console.error("登出失敗", error);
  }

  currentSession = null;
  isAdmin = false;
  closeDetail();
  renderAdminState();
  renderBookList();
  showToast("已登出");
}

      el.addEventListener("input", () => {

        if (id === "formSubtitle") formState.subtitle = [...el.value].slice(0, MAX_SUBTITLE).join("");

    });

  const box = document.getElementById("formAuthorResults");
  if (!box) return;

  const q = String(keyword || "").trim().toLocaleLowerCase("zh-Hant");

  // 只要重新輸入，就先取消原本選定的作者
  formState.authorId = null;
  formState.author = "";

  const hiddenInput = document.getElementById("formAuthorId");
  if (hiddenInput) hiddenInput.value = "";

  updateWorkSaveButton();

  if (!q) {
    box.innerHTML = "";
    return;
  }

  const matchedAuthors = authors
    .filter(author => {
      const name = String(author.name || "").toLocaleLowerCase("zh-Hant");
      const id = String(author.id || "");

      return name.includes(q) || id.includes(q);
    })
    .slice(0, 20);

  if (!matchedAuthors.length) {
    box.innerHTML = `
      <div style="padding:10px 4px;color:var(--muted);font-size:12px;">
        找不到作者，可以使用「＋ 新增作者」
      </div>
    `;
    return;
  }

  box.innerHTML = matchedAuthors.map(author => {
    const workCount = getAuthorWorkCount(author.id);

    return `
      <button
        type="button"
        onclick="selectFormAuthor('${escapeAttr(author.id)}')"
        style="
          display:block;
          width:100%;
          padding:10px 12px;
          margin-top:5px;
          text-align:left;
          border:1px solid var(--line);
          border-radius:10px;
          background:var(--surface-solid);
          color:var(--text);
          cursor:pointer;
        "
      >
        #${escapeHTML(author.id)}
        ${escapeHTML(author.name || "未命名作者")}
        ｜本站收錄 ${workCount} 部
      </button>
    `;
  }).join("");
}

function selectFormAuthor(authorId) {
  const author = findAuthorById(authorId);
  if (!author) return;

  formState.authorId = author.id;
  formState.author = author.name || "";

  const searchInput = document.getElementById("formAuthorSearch");
  const hiddenInput = document.getElementById("formAuthorId");
  const results = document.getElementById("formAuthorResults");

  if (searchInput) {
    searchInput.value = author.name || "";
  }

  if (hiddenInput) {
    hiddenInput.value = author.id;
  }

  if (results) {
    results.innerHTML = "";
  }

  updateWorkSaveButton();
}

function setFormAuthor(authorId) {
  const author = findAuthorById(authorId);

  formState.authorId = author ? author.id : null;
  formState.author = author ? author.name : "";

  updateWorkSaveButton();
}

function setFormStatus(status) {
  formState.status = status;
  if (status !== "停更中") formState.lastPublishedAt = "";
  renderWorkForm();
}

function toggleFormCreationType(type) {
  const set = new Set(formState.creationTypes);
  set.has(type) ? set.delete(type) : set.add(type);
  formState.creationTypes = [...set];
  renderWorkForm();
}

function toggleFormSeries(id) {
  const el = document.getElementById(`formSeries-${id}`);
  if (el) el.classList.toggle("show");
}

function toggleFormCategory(category) {
  const set = new Set(formState.categories);
  set.has(category) ? set.delete(category) : set.add(category);
  formState.categories = [...set];

  const btns = document.querySelectorAll(".series-children .check-chip");
  btns.forEach(btn => {
    if (btn.textContent.trim() === category) {
      btn.classList.toggle("active", set.has(category));
    }
  });

  /* 更新系列計數不必整張表單重畫，簡化操作 */
  SERIES.forEach(group => {
    const block = document.getElementById(`formSeries-${group.id}`)?.closest(".series-block");
    const label = block?.querySelector(".series-toggle span:last-child");
    if (label) {
      const count = group.options.filter(option => set.has(option)).length;
      label.textContent = count || "＋";
    }
  });
}

function toggleFormEscape() {
  formState.escape = !formState.escape;
  const btn = [...document.querySelectorAll(".escape-chip")]
    .find(node => node.textContent.trim() === ESCAPE_TAG && document.getElementById("modalCard").contains(node));
  if (btn) btn.classList.toggle("active", formState.escape);
}

function handleCustomTagKeydown(event) {
  if (event.key === "Enter" || event.key === ",") {
    event.preventDefault();
    addCustomTag();

}

function addCustomTag() {
  const input = document.getElementById("customTagInput");
  if (!input) return;

  const value = [...input.value.trim()].slice(0, MAX_CUSTOM_TAG).join("");
  if (!value) return;

  if (!formState.customTags.includes(value)) {
    formState.customTags.push(value);
  }

  input.value = "";
  document.getElementById("customTagPreview").innerHTML = renderFormCustomTags();
}

function renderFormCustomTags() {
  return formState.customTags.map((tag, index) => `
    <span class="tag-edit-chip">
      ${escapeHTML(tag)}
      <button type="button" onclick="removeCustomTag(${index})">×</button>
    </span>
  `).join("");
}

function removeCustomTag(index) {
  formState.customTags.splice(index, 1);
  document.getElementById("customTagPreview").innerHTML = renderFormCustomTags();
}

function renderLinkEditorRows() {
  return formState.links.map((link, index) => `
    <div class="link-editor-row">
      <div class="link-editor-grid">
        <div class="field">
          <label>平台／網站名稱</label>
          <input
            value="${escapeAttr(link.label)}"
            placeholder="例如：角角者"
            oninput="updateLinkRow(${index}, 'label', this.value)"
          >
        </div>
        <div class="field">
          <label>作品網址</label>
          <input
            value="${escapeAttr(link.url)}"
            placeholder="https://..."
            oninput="updateLinkRow(${index}, 'url', this.value)"
          >
        </div>
      </div>

      <div class="link-row-actions">
        <button class="mini-btn" type="button" onclick="moveLinkRow(${index}, -1)" ${index === 0 ? "disabled" : ""}>↑</button>
        <button class="mini-btn" type="button" onclick="moveLinkRow(${index}, 1)" ${index === formState.links.length - 1 ? "disabled" : ""}>↓</button>
        <button class="mini-btn danger" type="button" onclick="removeLinkRow(${index})">刪除</button>
      </div>
    </div>
  `).join("");
}

function updateLinkRow(index, field, value) {
  if (!formState.links[index]) return;
  formState.links[index][field] = value;
}

function addLinkRow() {
  formState.links.push({ label: "", url: "" });
  document.getElementById("linkEditorList").innerHTML = renderLinkEditorRows();
}

function removeLinkRow(index) {
  formState.links.splice(index, 1);
  if (!formState.links.length) formState.links.push({ label: "", url: "" });
  document.getElementById("linkEditorList").innerHTML = renderLinkEditorRows();
}

function moveLinkRow(index, direction) {
  const target = index + direction;
  if (target < 0 || target >= formState.links.length) return;

  const copy = [...formState.links];
  [copy[index], copy[target]] = [copy[target], copy[index]];
  formState.links = copy;
  document.getElementById("linkEditorList").innerHTML = renderLinkEditorRows();
}

async function saveWorkFromForm() {
  if (!isAdmin) {
    showToast("請先登入管理者");
    return;
  }

  
  formState.title = document.getElementById("formTitle")?.value.trim() || formState.title.trim();
  formState.subtitle = [...(document.getElementById("formSubtitle")?.value.trim() || "")].slice(0, MAX_SUBTITLE).join("");
  formState.hook = [...(document.getElementById("formHook")?.value.trim() || "")].slice(0, MAX_HOOK).join("");
  formState.copy = document.getElementById("formCopy")?.value.trim() || "";

  if (formState.status === "停更中") {
    formState.lastPublishedAt =
      document.getElementById("formLastPublishedAt")?.value || "";
  } else {
    formState.lastPublishedAt = "";
  }

  if (!formState.author || !formState.title || !formState.hook) {
    showToast("作者、書名與一句話簡介為必填");
    return;
  }

  formState.links = formState.links
    .map(link => ({
      label: String(link.label || "").trim(),
      url: String(link.url || "").trim()
    }))
    .filter(link => link.label || link.url);

  const saveBtn = document.getElementById("workSaveBtn");
  if (saveBtn) {
    saveBtn.disabled = true;
    saveBtn.textContent = formState.id ? "儲存中…" : "新增中…";
  }

  try {
    if (formState.id) {
      const saved = await updateWorkInDatabase(normalizeWork(formState));
      const index = works.findIndex(work => String(work.id) === String(saved.id));
      if (index >= 0) works[index] = saved;
      showToast("作品已更新");
    } else {
      const saved = await insertWork(normalizeWork(formState));
      works.unshift(saved);
      currentPage = 1;
      showToast("作品已新增");
    }

    closeModal();
    renderAll();
  } catch (error) {
    console.error("作品儲存失敗", error);
    showToast("作品儲存失敗，請確認登入狀態與資料庫欄位");
    if (saveBtn) {
      saveBtn.disabled = false;
      saveBtn.textContent = formState.id ? "儲存變更" : "新增作品";
    }
  }
}

async function deleteWork(id) {
  if (!isAdmin) {
    showToast("請先登入管理者");
    return;
  }

  const work = findWork(id);
  if (!work) return;

  openModal(`
    <div class="modal-head">
      <h3>刪除作品</h3>
      <button class="icon-btn" type="button" onclick="closeModal()">×</button>
    </div>

    <div class="modal-body">
      <p style="margin:0;line-height:1.8;color:var(--text);">
        確定要刪除《${escapeHTML(work.title)}》嗎？
      </p>

      <p style="margin:10px 0 0;line-height:1.8;color:var(--danger);font-size:12px;">
        刪除後無法復原。
      </p>
    </div>

    <div class="form-footer">
      <button class="ghost-btn" type="button" onclick="closeModal()">取消</button>
      <button
        class="save-btn"
        type="button"
        onclick="confirmDeleteWork('${work.id}')"
        style="background:var(--danger);"
      >確定刪除</button>
    </div>
  `, true);
}

async function confirmDeleteWork(id) {
  if (!isAdmin) {
    closeModal();
    showToast("請先登入管理者");
    return;
  }

  const work = findWork(id);
  if (!work) {
    closeModal();
    return;
  }

  try {
    await deleteWorkFromDatabase(work.id);

    works = works.filter(
      item => String(item.id) !== String(work.id)
    );

    closeModal();
    closeDetail();
    renderAll();
    showToast("作品已刪除");
  } catch (error) {
    console.error("刪除作品失敗", error);
    showToast("刪除作品失敗，請確認登入狀態");
  }
}

let siteViewCount = 0;

async function updateSiteCounter() {
  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/rpc/increment_site_counter`,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
"apikey": SUPABASE_PUBLISHABLE_KEY
        },
        body: JSON.stringify({
          p_site_key: "Fiction_v3_0"
        })
      }
    );

    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }

    siteViewCount = Number(await response.json());

  } catch (error) {
    console.error("計數器更新失敗：", error);
  }
}

/* -------------------- Modal -------------------- */

function openModal(html, small = false) {
  const wrap = document.getElementById("modalWrap");
  const card = document.getElementById("modalCard");
  card.className = `modal-card${small ? " small" : ""}`;
  card.innerHTML = html;
  wrap.classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("modalWrap").classList.remove("show");
  document.getElementById("modalCard").innerHTML = "";
  document.body.style.overflow = activeDetailId ? "hidden" : "";
}

function handleModalBackdrop(event) {
  if (event.target.id !== "modalWrap") return;

  if (window.shareCardPreview) {
    closeShareCardPreview();
  } else {
    closeModal();
  }
}

/* -------------------- 搜尋 -------------------- */

document.getElementById("searchInput").addEventListener("input", event => {
  searchText = event.target.value;
  currentPage = 1;
  document.getElementById("searchClear").classList.toggle("show", Boolean(searchText));
  renderBookList();
});

document.getElementById("searchClear").addEventListener("click", () => {
  searchText = "";
  currentPage = 1;
  document.getElementById("searchInput").value = "";
  document.getElementById("searchClear").classList.remove("show");
  renderBookList();
});

document.getElementById("manageBtn").addEventListener("click", openLogin);
document.getElementById("addWorkBtn").addEventListener("click", () => openWorkForm());

/* -------------------- 總渲染 -------------------- */

function renderAll() {
  renderFilters();
  renderBookList();
  renderAdminState();
}

/* -------------------- 啟動 -------------------- */

async function init() {
  try {
    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error) throw error;

    currentSession = data.session || null;

    if (
      currentSession &&
      currentSession.user &&
      currentSession.user.id === ADMIN_UID
    ) {
      isAdmin = true;
    } else {
      if (currentSession) {
        await supabaseClient.auth.signOut();
      }
      currentSession = null;
      isAdmin = false;
    }
  } catch (error) {
    console.error("讀取登入狀態失敗", error);
    currentSession = null;
    isAdmin = false;
  }

  renderAdminState();
renderFilters();
await loadAuthors();
await loadWorks();
}

supabaseClient.auth.onAuthStateChange((event, session) => {
  currentSession = session;

  if (session?.user?.id === ADMIN_UID) {
    isAdmin = true;
  } else {
    isAdmin = false;
  }

  renderAdminState();

  if (!loadingWorks) {
    renderBookList();

    if (activeDetailId) {
      openDetail(activeDetailId, false);
    }
  }

  /* 從 Supabase 密碼重設信回來 */
  if (
    event === "PASSWORD_RECOVERY" &&
    session?.user?.id === ADMIN_UID
  ) {
    setTimeout(() => {
      openPasswordReset();
    }, 100);
  }
});

init();
updateSiteCounter();


</script>
