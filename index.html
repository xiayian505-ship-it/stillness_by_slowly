<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="慢慢｜stillness by slowly想到什麼就做什麼創作、藝術、工具、遊戲、生活與靈感的集合地">
    <title>慢 慢 | Stillness by Slowly</title>

    <!-- 網址分享預覽圖片由獨立圖床提供，GitHub 專案不存放圖片檔 -->
    <link rel="canonical" href="https://stillnessbyslowly.com/">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="慢 慢 | Stillness by Slowly">
    <meta property="og:title" content="慢 慢 | Stillness by Slowly">
    <meta property="og:description" content="想到什麼就做什麼">
    <meta property="og:url" content="https://stillnessbyslowly.com/">
    <meta property="og:image" content="https://img.stillnessbyslowly.com/images/2026/10/517c2edd-35c6-4134-8ea2-780a48b2bf3b_SBS.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:alt" content="藍綠色終端機風格的慢 慢藝術字">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="慢 慢 | Stillness by Slowly">
    <meta name="twitter:description" content="想到什麼就做什麼">
    <meta name="twitter:image" content="https://img.stillnessbyslowly.com/images/2026/10/517c2edd-35c6-4134-8ea2-780a48b2bf3b_SBS.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./index.css?v=20261026b">
    <link rel="stylesheet" href="./index_style.css?v=20261026b">
    <script src="./index.js?v=20261026b" defer></script>
    <script src="./index_style.js?v=20261026b" defer></script>
</head>
<body>
    <div class="site-wrap">
        <header class="site-header">
            <div class="brand" aria-label="慢 慢">
                <div class="brand-text">
                    <strong>慢 慢</strong>
                </div>
            </div>

            <!-- SVG 小終端機本身就是點擊入口，沒有可見的按鈕外框 -->
            <button class="terminal-search-toggle" id="terminal-search-toggle" type="button"
                    aria-label="開啟站內搜尋終端機" aria-haspopup="dialog" aria-controls="terminal-search-dialog">
                <svg viewBox="0 0 42 34" width="37" height="30" fill="none" stroke="currentColor"
                     stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <rect x="2" y="2" width="38" height="30" rx="5"/>
                    <path d="M2 10H40"/>
                    <circle cx="8" cy="6" r="1" fill="currentColor" stroke="none"/>
                    <circle cx="13" cy="6" r="1" fill="currentColor" stroke="none"/>
                    <circle cx="18" cy="6" r="1" fill="currentColor" stroke="none"/>
                    <path d="M10 17L16 22L10 27M21 27H29"/>
                </svg>
            </button>

            <!-- 使用者自行切換深淺色，只顯示圖示，不顯示外框 -->
            <button class="theme-toggle" type="button" id="theme-toggle"
                    aria-label="切換淺色或深色" aria-pressed="false">
                <span aria-hidden="true" class="theme-symbol">☼</span>
            </button>
        </header>

        <main>
            <section class="hero" aria-labelledby="hero-title">
                <p class="hero-prompt"><span class="prompt-green">slowly</span><span class="prompt-muted">@stillness</span>:<span class="prompt-blue">~</span>$ <span class="prompt-command">./hello.sh</span></p>
                <p class="hero-kicker">WELCOME TO THE 慢 慢 | Stillness by Slowly <span aria-hidden="true">✳</span></p>
                <h1 id="hero-title">想到什麼<br><span>就做什麼</span></h1>
                <p class="hero-description">這裡是 <strong>慢 慢 | Stillness by Slowly</strong></p>
                <p class="hero-motto">♡ 開心就好我的 <code>&lt;a&gt;</code> 又沒壞</p>
            </section>

            <section class="categories-section" aria-labelledby="categories-title">
                <div class="section-heading">
                    <div>
                        <h2 id="categories-title">慢 慢 <span aria-hidden="true">✦</span></h2>
                    </div>
                    <p class="window-count" id="window-count" aria-live="polite">載入分類中…</p>
                </div>

                <!-- 分類視窗由 index.js 的 siteCategories 統一產生 -->
                <!-- 藝術、工具、遊戲與電子宮廟均有可展開資料夾；有圖片者在展開後預覽 -->
                <div class="terminal-grid" id="terminal-grid"></div>
                <noscript><p class="noscript">此版的分類視窗由 JavaScript 生成，請啟用 JavaScript 觀看</p></noscript>
            </section>
        </main>

        <footer class="site-footer">
            <span>慢 慢 | Stillness by Slowly</span>
        </footer>
    </div>

    <!-- 真正的終端機外觀，功能只負責定位首頁已收錄的分類與資料夾 -->
    <div class="search-overlay" id="terminal-search-overlay" hidden>
        <section class="search-terminal" id="terminal-search-dialog" role="dialog" aria-modal="true"
                 aria-label="站內終端機" tabindex="-1">
            <div class="search-window-top">
                <span class="window-dots" aria-hidden="true"><i></i><i></i><i></i></span>
                <span class="search-window-title">search.terminal</span>
                <button class="search-terminal-close" id="terminal-search-close" type="button"
                        aria-label="關閉終端機">×</button>
            </div>
            <div class="search-terminal-body">
                <form id="terminal-search-form" autocomplete="off" role="search">
                    <label class="search-command-line" for="terminal-search-input">
                        <span class="search-command-prefix" aria-hidden="true"><span class="search-user">slowly</span>@stillness:~$</span>
                        <input id="terminal-search-input" type="text" name="command"
                               aria-label="輸入名稱定位主頁分類或資料夾"
                               autocomplete="off" autocapitalize="off" spellcheck="false">
                    </label>
                </form>
                <div class="search-terminal-output" id="terminal-search-output" role="status" aria-live="polite"></div>
            </div>
        </section>
    </div>

    <!-- 固定於畫面右下角：向下捲動後才會出現 -->
    <button class="back-to-top" id="back-to-top" type="button"
            aria-label="返回頁面頂端" tabindex="-1">
        <span aria-hidden="true">↑</span>
        <span>TOP</span>
    </button>
</body>
</html>
