<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>慢 慢 | stillness by slowly</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Noto Sans TC", sans-serif;
      background-color: #f5f5f2;
      color: #8592A2;
      line-height: 1.8;
    }

    /* 品牌識別 */
    .identity {
      text-align: center;
      padding: 30px;
      font-size: 1.2rem;
    }

    /* 上方分類列 */
    .tabs-wrap {
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: #f5f5f2;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 30px;
    }

    .tabs {
      display: flex;
      flex-wrap: nowrap;
      overflow-x: auto;
      white-space: nowrap;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);

      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 0 0 auto;
      padding: 10px 18px 8px 0;
      margin-right: 18px;
      font-size: 1rem;
      font-weight: 400;
      cursor: pointer;
      opacity: 0.6;
      border-bottom: 1px solid transparent;
    }

    .tab.active {
      opacity: 1;
      border-bottom-color: #8592A2;
    }

    /* 內容 */
    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 30px;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .page p {
      font-size: 1rem;
      font-weight: 400;
    }
  </style>
</head>

<body>

  <header class="identity">
    慢　慢　|　stillness by slowly
  </header>

  <!-- 分類 -->
  <div class="tabs-wrap">
    <div class="tabs">
      <div class="tab active" data-tab="about">關於慢慢</div>
      <div class="tab" data-tab="creative">創作</div>
      <div class="tab" data-tab="time">時光</div>
      <div class="tab" data-tab="tools">慢慢小工具</div>
    </div>
  </div>

  <!-- 內容 -->
  <main class="content">

    <div class="page active" id="about">
      <p>（關於慢慢之後填）</p>
    </div>

    <div class="page" id="creative">
      <p>（創作之後填）</p>
    </div>

    <div class="page" id="time">
      <p>（時光之後填）</p>
    </div>

    <div class="page" id="tools">
      <p>（慢慢小工具之後填）</p>
    </div>

  </main>

  <script>
    const tabs = document.querySelectorAll(".tab");
    const pages = document.querySelectorAll(".page");

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {

        const target = tab.dataset.tab;

        tabs.forEach(item => {
          item.classList.remove("active");
        });

        pages.forEach(page => {
          page.classList.remove("active");
        });

        tab.classList.add("active");
        document.getElementById(target).classList.add("active");

      });
    });
  </script>

</body>
</html>
