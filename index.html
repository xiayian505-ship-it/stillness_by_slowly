<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark light">
    <meta name="description" content="慢慢｜stillness by slowly想到什麼就做什麼創作、藝術、工具、小遊戲、生活與靈感的集合地">
    <title>慢慢｜stillness by slowly · 終端機首頁（純區塊預覽）</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./index.css">
    <link rel="stylesheet" href="./index_style.css">
    <script src="./index.js" defer></script>
    <script src="./index_style.js" defer></script>
</head>
<body>
    <div class="site-wrap">
        <header class="site-header">
            <div class="brand" aria-label="慢 慢">
                <span class="brand-mark" aria-hidden="true">~</span>
                <div class="brand-text">
                    <strong>慢 慢</strong>
                </div>
            </div>
            <button class="theme-toggle" type="button" id="theme-toggle" aria-label="切換淺色或深色" aria-pressed="false">
                <span aria-hidden="true" class="theme-symbol">☼</span>
                <span>切換色調</span>
            </button>
        </header>

        <main>
            <section class="hero" aria-labelledby="hero-title">
                <p class="hero-prompt"><span class="prompt-green">slowly</span><span class="prompt-muted">@stillness</span>:<span class="prompt-blue">~</span>$ <span class="prompt-command">./hello.sh</span></p>
                <p class="hero-kicker">WELCOME TO THE 慢 慢 | Stillness by Slowly <span aria-hidden="true">✳</span></p>
                <h1 id="hero-title">想到什麼<br><span>就做什麼</span></h1>
                <p class="hero-description">這裡是 <strong>慢 慢 | Stillness by Slowly</strong></p>
                <p class="hero-motto">♡ 開心就好我的 <code>&lt;a&gt;</code> 又沒壞</p>
            </section>

            <section class="categories-section" aria-labelledby="categories-title">
                <div class="section-heading">
                    <div>
                        <h2 id="categories-title">慢 慢 <span aria-hidden="true">✦</span></h2>
                    </div>
                    <p class="window-count" id="window-count" aria-live="polite">載入分類中…</p>
                </div>

                <!-- 只有大分類；日後作品連結確認後再加入 -->
                <!-- 新增分類只需要編輯 index.js 的 siteCategories -->
                <div class="terminal-grid" id="terminal-grid"></div>
                <noscript><p class="noscript">此版的分類視窗由 JavaScript 生成，請啟用 JavaScript 觀看</p></noscript>
            </section>
        </main>

        <footer class="site-footer">
            <span>慢 慢 | Stillness by Slowly</span>
        </footer>
    </div>

    <!-- 固定於畫面右下角：向下捲動後才會出現 -->
    <button class="back-to-top" id="back-to-top" type="button"
            aria-label="返回頁面頂端" tabindex="-1">
        <span aria-hidden="true">↑</span>
        <span>TOP</span>
    </button>
</body>
</html>
